spring.application.name=home
server.port=8080
server.address=0.0.0.0
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:home_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.thymeleaf.cache=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=160MB
spring.servlet.multipart.max-request-size=160MB
server.tomcat.max-swallow-size=178257920
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
