<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お付き合い帳一覧</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><style>.list-wrap{width:min(1500px,94vw);margin:auto}.list-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.add-button{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;border-radius:12px;background:#fff;color:#1671e8;border:1px solid #d7e1ec;font-size:2rem;text-decoration:none;box-shadow:0 4px 14px rgba(20,28,40,.1)}.table-wrap tbody tr{cursor:pointer}.table-wrap tbody tr:hover{background:#eaf6ff}.status-label{display:inline-flex;padding:5px 10px;border-radius:999px;font-size:.82rem;font-weight:700}.status-0{background:#fff0c7;color:#795900}.status-1{background:#dff3e7;color:#17663a}.status-2{background:#e9edf1;color:#52606c}.search-dialog{width:min(560px,calc(100vw - 28px));padding:0;border:0;border-radius:14px}.search-dialog::backdrop{background:rgba(20,28,40,.45);backdrop-filter:blur(5px)}.search-body{padding:26px}.search-form{display:grid;gap:18px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}@media(max-width:700px){.list-wrap{width:94vw}}</style></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-area"><h1>お付き合い帳一覧</h1></div><div class="list-wrap"><div class="success" th:if="${param.saved}">登録しました。</div><section class="panel"><div class="list-tools"><button type="button" class="secondary" id="search-open">検索</button><a class="add-button" th:href="@{/communication/new}" aria-label="新規登録">＋</a></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>日付</th><th>from</th><th>to</th><th>お品物</th><th>金額</th><th>説明</th><th>返却</th></tr></thead><tbody><tr th:each="r:${rows}" th:attr="data-url=@{|/communication/${r.id}|}"><td th:text="${r.id}"></td><td class="no-wrap" th:text="${#dates.format(r.receive_date,'yyyy/MM/dd')}"></td><td th:text="${r.receive_from}"></td><td th:text="${r.receive_to}"></td><td th:text="${r.receive_item}"></td><td class="no-wrap" th:text="|${r.receive_amount?:0}円|"></td><td th:text="${r.receive_remarks}"></td><td><span class="status-label" th:classappend="| status-${r.return_flag?:0}|" th:text="${r.return_flag==1?'返却済':r.return_flag==2?'返却不要':'未返却'}"></span></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="8">該当するデータはありません。</td></tr></tbody></table></div></section></div></main><footer th:replace="~{fragments :: footer}"></footer><dialog id="search-dialog" class="search-dialog"><div class="search-body"><h2>検索条件</h2><form class="search-form" method="get" th:action="@{/communication}"><label>キーワード<input name="keyword" th:value="${keyword}" placeholder="ID・from・toを検索"></label><fieldset><legend>返却状況</legend><label><input type="radio" name="returnFlag" value="" th:checked="${returnFlag==null}">すべて</label><label><input type="radio" name="returnFlag" value="0" th:checked="${returnFlag==0}">未返却</label><label><input type="radio" name="returnFlag" value="1" th:checked="${returnFlag==1}">返却済</label><label><input type="radio" name="returnFlag" value="2" th:checked="${returnFlag==2}">返却不要</label></fieldset><div class="dialog-actions"><button type="button" class="secondary" id="search-cancel">キャンセル</button><a class="button secondary" th:href="@{/communication}">リセット</a><button>検索</button></div></form></div></dialog><script>(()=>{const dialog=document.getElementById('search-dialog');document.getElementById('search-open').onclick=()=>dialog.showModal();document.getElementById('search-cancel').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.querySelectorAll('tbody tr[data-url]').forEach(row=>row.onclick=()=>location.href=row.dataset.url)})();</script></body></html>
