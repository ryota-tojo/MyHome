<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お付き合い帳編集</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}">
<style>.form-wrap{width:min(1100px,80vw);margin:auto}.vertical-form{display:grid;gap:18px}.pair-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form-actions{display:flex;justify-content:flex-end;margin-top:8px}.section-divider{margin:10px 0}.status-options{display:flex;align-items:center;flex-wrap:wrap;gap:12px 24px}.status-options label{display:inline-flex;align-items:center;gap:7px;margin:0}.status-options input{width:auto;margin:0}.amount-button{width:100%;text-align:right;background:#fff;color:#1f2933;border:1px solid #bbc4ce}.amount-dialog{width:min(460px,calc(100vw - 28px));padding:0;border:0;border-radius:14px}.amount-dialog::backdrop{background:rgba(20,28,40,.48);backdrop-filter:blur(4px)}.amount-body{padding:24px}.amount-body input{font-size:1.4rem;text-align:right}.quick-amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.amount-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:700px){.form-wrap{width:94vw}.pair-row{grid-template-columns:1fr}}</style></head>
<body><header th:replace="~{fragments :: header}"></header><main><div class="form-wrap"><div class="title-row"><h1>お付き合い帳編集</h1><a th:href="@{/communication}">一覧へ戻る</a></div><div class="success" th:if="${param.updated}">更新しました。</div><div class="alert" th:if="${error}" th:text="${error}"></div><section class="panel"><form class="vertical-form" method="post" th:action="@{|/communication/${row.id}|}"><h2>いただきもの</h2><label>ID<input name="id" th:value="${row.id}" readonly></label><label><span class="label-title">日付 <span class="required">必須</span></span><input type="date" name="receiveDate" th:value="${#dates.format(row.receive_date,'yyyy-MM-dd')}" required></label><div class="pair-row"><label><span class="label-title">from <span class="required">必須</span></span><input name="receiveFrom" th:value="${row.receive_from}" required maxlength="200"></label><label><span class="label-title">to <span class="required">必須</span></span><input name="receiveTo" th:value="${row.receive_to}" required maxlength="200"></label></div><div class="pair-row"><label><span class="label-title">品物 <span class="required">必須</span></span><input name="receiveItem" th:value="${row.receive_item}" required maxlength="200"></label><label><span class="label-title">金額 <span class="required">必須</span></span><input type="hidden" name="receiveAmount" id="receiveAmount" th:value="${row.receive_amount}"><button type="button" class="amount-button" data-amount-target="receiveAmount" th:text="|${row.receive_amount?:0}円|">0円</button></label></div><label>説明<textarea name="receiveRemarks" maxlength="500" th:text="${row.receive_remarks}"></textarea></label><hr class="section-divider"><h2>おかえし</h2><label>日付<input type="date" name="returnDate" th:value="${row.return_date==null?'':#dates.format(row.return_date,'yyyy-MM-dd')}"></label><div class="pair-row"><label>品物<input name="returnItem" th:value="${row.return_item}" maxlength="200"></label><label>金額<input type="hidden" name="returnAmount" id="returnAmount" th:value="${row.return_amount?:0}"><button type="button" class="amount-button" data-amount-target="returnAmount" th:text="|${row.return_amount?:0}円|">0円</button></label></div><label>説明<textarea name="returnRemarks" maxlength="500" th:text="${row.return_remarks}"></textarea></label><fieldset><legend>ステータス <span class="required">必須</span></legend><div class="status-options"><label><input type="radio" name="returnFlag" value="0" th:checked="${row.return_flag==null or row.return_flag==0}" required><span>未返却</span></label><label><input type="radio" name="returnFlag" value="1" th:checked="${row.return_flag==1}"><span>返却済</span></label><label><input type="radio" name="returnFlag" value="2" th:checked="${row.return_flag==2}"><span>返却不要</span></label></div></fieldset><div class="form-actions"><button>更新</button></div></form></section></div></main><footer th:replace="~{fragments :: footer}"></footer>
<dialog id="amount-dialog" class="amount-dialog"><div class="amount-body"><h2>金額入力</h2><input id="amount-input" type="number" min="0" max="2147483647"><div class="quick-amounts"><button type="button" data-add="100">＋100</button><button type="button" data-add="500">＋500</button><button type="button" data-add="1000">＋1,000</button><button type="button" data-add="5000">＋5,000</button><button type="button" data-add="10000">＋10,000</button><button type="button" class="secondary" id="amount-clear">クリア</button></div><div class="amount-actions"><button type="button" class="secondary" id="amount-cancel">キャンセル</button><button type="button" id="amount-set">設定</button></div></div></dialog>
<script>(()=>{const dialog=document.getElementById('amount-dialog'),input=document.getElementById('amount-input');let hidden,button;document.querySelectorAll('[data-amount-target]').forEach(x=>x.onclick=()=>{button=x;hidden=document.getElementById(x.dataset.amountTarget);input.value=hidden.value||0;dialog.showModal();input.focus();input.select()});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>input.value=(Number(input.value)||0)+Number(x.dataset.add));document.getElementById('amount-clear').onclick=()=>input.value=0;document.getElementById('amount-cancel').onclick=()=>dialog.close();document.getElementById('amount-set').onclick=()=>{const value=Math.max(0,Number(input.value)||0);hidden.value=value;button.textContent=value.toLocaleString('ja-JP')+'円';dialog.close()}})();</script></body></html>
