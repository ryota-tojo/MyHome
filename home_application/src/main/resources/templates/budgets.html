<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予算入力</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><style>
.budget-wrap{width:min(1200px,80vw);margin:auto}.period-card{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.period-form{display:flex;align-items:end;gap:12px}.period-form label{margin:0}.period-form input{width:120px}.budget-table-wrap{overflow:auto}.budget-table{width:100%;border-collapse:collapse}.budget-table th,.budget-table td{padding:13px 16px;border-bottom:1px solid #d9dfe4;text-align:left}.budget-table th:last-child,.budget-table td:last-child{text-align:right}.amount-wrap{display:inline-flex;align-items:center;gap:8px}.amount-wrap input{width:180px;text-align:right}.budget-total{display:flex;justify-content:flex-end;align-items:center;gap:18px;padding:18px 16px;font-weight:700;font-size:1.1rem}.apply-all{display:flex!important;flex-direction:row!important;align-items:center!important;gap:8px!important;margin:20px 0!important}.apply-all input{width:auto}.form-actions{display:flex;justify-content:flex-end;gap:12px}.copy-form{margin:0}.copy-button{background:#6c757d}.copy-button:hover{background:#5f676e}.empty-budget{text-align:center;padding:28px;color:#687078}
@media(max-width:700px){.budget-wrap{width:94vw}.period-card{align-items:stretch;flex-direction:column}.period-form{display:grid;grid-template-columns:1fr 1fr}.period-form button{grid-column:1/-1}.period-form input{width:100%}.budget-table th,.budget-table td{padding:11px 8px}.amount-wrap input{width:130px}.form-actions{flex-direction:column-reverse}.form-actions button{width:100%}}
</style></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-area"><h1>予算入力</h1></div><div class="budget-wrap"><div class="success" th:if="${param.saved}">予算を保存しました。</div><div class="success" th:if="${param.copied}">前月の予算をコピーしました。</div><div class="alert" th:if="${param.error}">月次確定済みの予算は変更できません。</div><div class="alert" th:if="${invalidBudgetCount!=null and invalidBudgetCount>0}" th:text="|無効または削除済みカテゴリーを使用している予算が${invalidBudgetCount}件あります。現在の有効なカテゴリーで予算を保存し直してください。|"></div>
<section class="panel period-card"><div><h2 th:text="|${year}年${month}月|">対象年月</h2><p>カテゴリーごとの予算を入力してください。</p></div><form class="period-form" method="get" th:action="@{/budgets}"><label>年<select name="year" required><option th:each="y:${yearOptions}" th:value="${y}" th:text="|${y}年|" th:selected="${y==year}"></option></select></label><label><span class="label-title">月 <span class="required">必須</span></span><select name="month" required><option th:each="m:${monthOptions}" th:value="${m}" th:text="|${m}月|" th:selected="${m==month}"></option></select></label><button type="submit">表示</button></form></section>
<section class="panel"><form method="post" th:action="@{/budgets}"><input type="hidden" name="year" th:value="${year}"><input type="hidden" name="month" th:value="${month}"><div class="budget-table-wrap"><table class="budget-table"><thead><tr><th>カテゴリー</th><th>予算額</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.category_name}"></td><td><input type="hidden" name="categoryIds" th:value="${r.id}"><span class="amount-wrap"><input type="number" name="amounts" min="0" max="2147483647" step="1" th:value="${r.amount}" required><span>円</span></span></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="2" class="empty-budget">有効なカテゴリーがありません。先にカテゴリーを登録してください。</td></tr></tbody></table></div><div class="budget-total"><span>合計</span><strong id="budget-total" th:text="|${#numbers.formatInteger(total,1,'COMMA')}円|"></strong></div><label class="apply-all"><input type="checkbox" name="applyAllMonths" value="true">年内すべての月に設定を反映する</label><div class="form-actions"><button type="button" class="copy-button" id="copy-button">前月の予算をコピーする</button><button type="submit" th:disabled="${#lists.isEmpty(rows)}">保存</button></div></form>
<form id="copy-form" class="copy-form" method="post" th:action="@{/budgets/copy-previous}"><input type="hidden" name="year" th:value="${year}"><input type="hidden" name="month" th:value="${month}"></form></section></div></main><footer th:replace="~{fragments :: footer}"></footer><script>
(()=>{const amounts=[...document.querySelectorAll('input[name="amounts"]')],total=document.getElementById('budget-total');const update=()=>total.textContent=amounts.reduce((s,x)=>s+(Number(x.value)||0),0).toLocaleString('ja-JP')+'円';amounts.forEach(x=>x.addEventListener('input',update));document.getElementById('copy-button').onclick=()=>{if(confirm('現在入力中の値を前月の予算で置き換えますか？'))document.getElementById('copy-form').submit()};})();
</script></body></html>
