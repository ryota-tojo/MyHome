<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初回セットアップ</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><script th:src="@{/js/required-labels.js}" defer></script><script th:src="@{/js/password-toggle.js}" defer></script><script th:src="@{/js/submit-guard.js}" defer></script></head>
<body class="auth"><main class="legacy-main"><div class="title-area"><h1 th:text="${initialAdmin}?'初回セットアップ':'パスワード変更'"></h1></div><div class="summary-area" th:text="${initialAdmin}?'管理者IDと新しいパスワードを設定してください。':'初回ログインのため、新しいパスワードを設定してください。'"></div><div class="single-column"><section class="legacy-menu"><div class="alert" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/account/change-password}" method="post" th:attr="data-initial-admin=${initialAdmin}" onsubmit="return this.dataset.initialAdmin!=='true'||confirm('設定完了後にログアウトします。新しい管理者IDでログインし直してください。続行しますか？')">
<label th:if="${initialAdmin}">管理者ID<input name="userId" th:value="${currentUserId}" minlength="4" maxlength="32" pattern="[A-Za-z0-9_-]+" required autofocus><small>半角英数字・_・-、4～32文字</small></label><label>新しいパスワード<input type="password" name="password" minlength="8" maxlength="72" required th:attr="autofocus=${!initialAdmin}"></label><label>新しいパスワード（確認）<input type="password" name="confirmation" minlength="8" maxlength="72" required></label><div class="button-center"><button th:text="${initialAdmin}?'設定を完了':'パスワードを変更'"></button></div></form></section></div></main></body></html>
