<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><script th:src="@{/js/password-toggle.js}" defer></script></head>
<body class="auth"><main class="legacy-main"><div class="title-area"><h1>ログイン</h1></div><div class="legacy-columns">
<section class="legacy-menu"><h2>ログインフォーム</h2><div class="alert" th:if="${param.error}">ユーザーIDまたはパスワードを確認してください。</div><div class="alert" th:if="${autoLoginError}" th:text="${autoLoginError}"></div><div class="alert" th:if="${param.maintenance}">現在メンテナンス中のため、一般ユーザーはログインできません。</div><div class="success" th:if="${param.registered}">ユーザー登録が完了しました。ログインできます。</div>
<form th:action="@{/login}" method="post"><label>ユーザー名<input name="username" maxlength="64" placeholder="ユーザー名を入力してください" required autofocus></label><label>パスワード<input type="password" name="password" maxlength="72" placeholder="パスワードを入力してください" required></label><div class="button-center"><button>ログイン</button></div></form>
</section>
<section class="legacy-menu"><h2>新規登録フォーム</h2><p>一般ユーザーを登録します。登録後すぐにログインできます。</p><div class="button-center"><a class="button-link" th:href="@{/register}">ユーザー新規登録</a></div></section>
</div><footer class="legacy-footer">家計簿 Java Edition</footer></main></body></html>
