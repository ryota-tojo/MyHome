<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユーザー新規登録</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><script th:src="@{/js/required-labels.js}" defer></script><script th:src="@{/js/password-toggle.js}" defer></script><script th:src="@{/js/submit-guard.js}" defer></script></head>
<body class="auth"><main class="legacy-main"><div class="title-area"><h1>ユーザー新規登録</h1></div><div class="summary-area">家計簿を利用するユーザーを登録します。</div><div class="single-column"><section class="legacy-menu"><div class="alert" th:if="${registrationError}" th:text="${registrationError}"></div><form th:action="@{/register}" th:object="${form}" method="post"><div class="alert" th:if="${#fields.hasAnyErrors()}"><div th:each="e:${#fields.allErrors()}" th:text="${e}"></div></div><label>ユーザー名<input th:field="*{userId}" minlength="4" maxlength="32" pattern="[A-Za-z0-9_-]+" placeholder="半角英数字・_・-、4～32文字" required></label><label>表示名<input th:field="*{userName}" maxlength="64" required></label><label>パスワード<input type="password" th:field="*{password}" minlength="8" maxlength="72" autocomplete="new-password" required></label><label>パスワード（確認）<input type="password" th:field="*{passwordConfirmation}" minlength="8" maxlength="72" autocomplete="new-password" required></label><div class="button-center"><button>登録</button></div></form><p><a th:href="@{/login}">ログインへ戻る</a></p></section></div></main></body></html>
