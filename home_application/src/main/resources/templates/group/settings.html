<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>所属グループ設定</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-area"><h1>所属グループ設定</h1></div><div class="success" th:if="${param.updated}">基本情報を更新しました。</div><div class="success" th:if="${param.saved}">設定を保存しました。</div><div class="alert" th:if="${param.error}" th:text="${param.error[0]=='duplicateId'?'所属グループIDはすでに使用されています。':'入力内容を確認してください。'}"></div>
<section class="panel group-detail-panel"><h2>基本情報</h2><form class="user-detail-form" th:action="@{/group/settings/basic}" method="post" onsubmit="return confirm('所属グループの基本情報を更新しますか？')"><label>所属グループID <span class="required">必須</span><input name="groupId" th:value="${group.group_id}" required pattern="[A-Za-z0-9_-]{4,64}" maxlength="64"></label><label>所属グループ表示名 <span class="required">必須</span><input name="groupName" th:value="${group.group_name}" required maxlength="100"></label><div class="form-actions"><button>更新</button></div></form></section>
<section class="panel group-detail-panel"><h2>家計簿設定</h2><form class="user-detail-form" method="post" th:action="@{/group/settings}"><label>表示年 <span class="required">必須</span><input type="number" name="displayYear" min="2000" max="2200" th:value="${displayYear}" required></label><div class="form-actions"><button>保存</button></div></form></section>
<section class="panel group-detail-panel"><h2>所属グループ情報</h2><dl class="detail-list"><dt>作成日時</dt><dd th:text="${group.create_date?:'-'}"></dd><dt>更新日時</dt><dd th:text="${group.update_date?:'-'}"></dd></dl></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
