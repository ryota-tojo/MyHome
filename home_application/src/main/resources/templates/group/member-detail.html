<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユーザー詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-row"><h1>ユーザー詳細</h1><a th:href="@{/group/members}">メンバー管理へ戻る</a></div>
<section class="panel group-detail-panel"><h2>基本情報</h2><dl class="detail-list"><dt>ユーザーID</dt><dd th:text="${member.user_id}"></dd><dt>ユーザー表示名</dt><dd th:text="${member.user_name}"></dd><dt>状態</dt><dd th:text="${member.delete_flag==1?'無効':'有効'}"></dd></dl></section>
<section class="panel group-detail-panel"><h2>所属情報</h2><dl class="detail-list"><dt>グループ権限</dt><dd th:text="${member.leader_flag==1?'リーダー':'メンバー'}"></dd><dt>参加承認</dt><dd th:text="${member.approve_flag==1?'承認済み':'承認待ち'}"></dd><dt>承認日時</dt><dd th:text="${member.approve_date?:'-'}"></dd><dt>所属日時</dt><dd th:text="${member.member_create_date?:'-'}"></dd></dl></section>
<section class="panel group-detail-panel"><h2>ユーザー情報</h2><dl class="detail-list"><dt>最終ログイン</dt><dd th:text="${member.last_login_at?:'-'}"></dd><dt>ログイン失敗回数</dt><dd th:text="${member.login_failure_count}"></dd><dt>ロック期限</dt><dd th:text="${member.locked_until?:'-'}"></dd><dt>パスワード最終変更</dt><dd th:text="${member.password_changed_at?:'-'}"></dd><dt>作成日時</dt><dd th:text="${member.create_date}"></dd><dt>更新日時</dt><dd th:text="${member.update_date}"></dd></dl></section>
<section class="panel table-wrap"><h2>対象ユーザーの操作履歴</h2><table><thead><tr><th class="nowrap">日時</th><th>画面</th><th>操作</th><th>結果</th><th>メッセージ</th></tr></thead><tbody><tr th:each="l:${logs}"><td class="nowrap" th:text="${l.created_at}"></td><td th:text="${l.screen_name}"></td><td th:text="${l.action_name}"></td><td th:text="${l.result_name}"></td><td th:text="${l.detail_display}"></td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="5">操作履歴はありません。</td></tr></tbody></table></section><nav class="pagination"><a th:if="${logPage>1}" th:href="@{|/group/members/${member.user_id}?logPage=${logPage-1}|}">前へ</a><span th:text="${logPage+' / '+logPages}"></span><a th:if="${logPage<logPages}" th:href="@{|/group/members/${member.user_id}?logPage=${logPage+1}|}">次へ</a></nav>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
