<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メンバー管理</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><style>.member-order-note{width:min(1500px,94vw);margin:0 auto 10px;color:#66717c}.member-order-column{width:48px;text-align:center}.member-order-column .drag-handle{display:inline-flex;align-items:center;justify-content:center;min-width:34px;min-height:34px;cursor:grab;touch-action:none;user-select:none;color:#65717b}.member-table-full tbody tr.dragging,.member-table-full tbody tr.touch-sorting{opacity:.65;background:#e5f3fb}</style></head><body><header th:replace="~{fragments :: header}"></header><main>
<div class="title-area"><h1>メンバー管理</h1></div><div class="success" th:if="${param.created}">ユーザーを登録しました。</div><div class="alert" th:if="${param.error}">最後のリーダーは解除・除籍できません。</div>
<form class="attached-search" method="get"><input name="q" th:value="${q}" placeholder="ユーザーID・表示名を検索"><input type="hidden" name="memberStatuses" th:value="${memberStatuses}"><input type="hidden" name="memberRoles" th:value="${memberRoles}"><input type="hidden" name="memberApprovals" th:value="${memberApprovals}"><input type="hidden" name="memberCreated" th:value="${memberCreated}"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><button>検索</button></form>
<div class="table-toolbar"><div class="table-toolbar__left"><span th:text="${'全'+memberTotal+'件'}"></span><div class="table-toolbar__resets"><a class="filter-reset" th:if="${!#strings.isEmpty(memberStatuses) or !#strings.isEmpty(memberRoles) or !#strings.isEmpty(memberApprovals) or !#strings.isEmpty(memberCreated)}" th:href="@{/group/members(q=${q},sort=${sort},direction=${direction})}">フィルタを解除</a><a class="filter-reset" th:if="${sort!='display_no' or direction!='asc'}" th:href="@{/group/members(q=${q},memberStatuses=${memberStatuses},memberRoles=${memberRoles},memberApprovals=${memberApprovals},memberCreated=${memberCreated})}">並び替えを解除</a><a class="filter-reset" th:unless="${manualOrder}" th:href="@{/group/members}">表示順を変更</a></div></div><a class="add-button" th:href="@{/group/members/new}" aria-label="ユーザー新規登録">＋</a></div>
<p class="member-order-note" th:if="${manualOrder}">左のハンドルをドラッグして表示順を変更できます。</p>
<section class="panel table-wrap member-table-full"><table><thead><tr><th class="member-order-column" aria-label="表示順"></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('user_id','ユーザーID')">ユーザーID</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('user_name','表示名')">表示名</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('status','状態')">状態</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('leader_flag','グループ権限')">グループ権限</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('approve_flag','参加承認')">参加承認</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('create_date','所属日時')">所属日時</button></th><th>操作</th></tr></thead><tbody id="member-sortable" data-touch-sortable th:attr="data-manual=${manualOrder},data-page=${page},data-order-url=@{/group/members/order(page=${page})}"><tr th:each="m:${members}" th:attr="data-id=${m.user_id},draggable=${manualOrder}"><td class="member-order-column"><span class="drag-handle" th:if="${manualOrder}" aria-label="並び替え">☰</span></td><td th:text="${m.user_id}"></td><td th:text="${m.user_name}"></td><td th:text="${m.delete_flag==1?'無効':'有効'}"></td><td th:text="${m.leader_flag==1?'リーダー':'メンバー'}"></td><td th:text="${m.approve_flag==1?'承認済み':'承認待ち'}"></td><td th:text="${m.create_date}"></td><td class="actions"><form th:if="${m.approve_flag!=1}" th:action="@{|/group/members/${m.user_id}/approve|}" method="post"><button>承認</button></form><form th:if="${m.approve_flag==1}" th:action="@{|/group/members/${m.user_id}/leader|}" method="post" onsubmit="return confirm('グループ権限を変更しますか？')"><button class="secondary" th:text="${m.leader_flag==1?'リーダー解除':'リーダー任命'}"></button></form><form th:action="@{|/group/members/${m.user_id}/remove|}" method="post" onsubmit="return confirm('このメンバーを除籍しますか？')"><button class="danger">除籍</button></form></td></tr><tr th:if="${#lists.isEmpty(members)}"><td colspan="8">該当する所属メンバーはいません。</td></tr></tbody></table></section>
<nav class="pagination"><a th:if="${page>1}" th:href="@{/group/members(page=${page-1},q=${q},memberStatuses=${memberStatuses},memberRoles=${memberRoles},memberApprovals=${memberApprovals},memberCreated=${memberCreated},sort=${sort},direction=${direction})}">前へ</a><span th:text="${page+' / '+pages}"></span><a th:if="${page<pages}" th:href="@{/group/members(page=${page+1},q=${q},memberStatuses=${memberStatuses},memberRoles=${memberRoles},memberApprovals=${memberApprovals},memberCreated=${memberCreated},sort=${sort},direction=${direction})}">次へ</a></nav>
<dialog id="member-column-settings" class="search-dialog column-dialog"><div class="search-dialog__heading"><h2 id="member-column-title">列の設定</h2><button type="button" class="search-dialog__close" onclick="this.closest('dialog').close()">×</button></div><form id="member-column-form" class="search-dialog__form" method="get"><input type="hidden" name="q" th:value="${q}"><input type="hidden" id="member-sort-value" name="sort" th:value="${sort}"><input type="hidden" id="member-statuses-value" name="memberStatuses" th:value="${memberStatuses}"><input type="hidden" id="member-roles-value" name="memberRoles" th:value="${memberRoles}"><input type="hidden" id="member-approvals-value" name="memberApprovals" th:value="${memberApprovals}">
<section class="column-setting" data-column="status"><h3>項目</h3><label class="choice-row"><input class="member-status-choice" type="checkbox" value="ACTIVE" th:checked="${#strings.isEmpty(memberStatuses) or #strings.contains(memberStatuses,'ACTIVE')}">有効</label><label class="choice-row"><input class="member-status-choice" type="checkbox" value="INACTIVE" th:checked="${#strings.isEmpty(memberStatuses) or #strings.contains(memberStatuses,'INACTIVE')}">無効</label></section>
<section class="column-setting" data-column="leader_flag"><h3>項目</h3><label class="choice-row"><input class="member-role-choice" type="checkbox" value="1" th:checked="${#strings.isEmpty(memberRoles) or #strings.contains(memberRoles,'1')}">リーダー</label><label class="choice-row"><input class="member-role-choice" type="checkbox" value="0" th:checked="${#strings.isEmpty(memberRoles) or #strings.contains(memberRoles,'0')}">メンバー</label></section>
<section class="column-setting" data-column="approve_flag"><h3>項目</h3><label class="choice-row"><input class="member-approval-choice" type="checkbox" value="1" th:checked="${#strings.isEmpty(memberApprovals) or #strings.contains(memberApprovals,'1')}">承認済み</label><label class="choice-row"><input class="member-approval-choice" type="checkbox" value="0" th:checked="${#strings.isEmpty(memberApprovals) or #strings.contains(memberApprovals,'0')}">承認待ち</label></section>
<section class="column-setting" data-column="create_date"><h3>項目</h3><label>日時の文字列<input name="memberCreated" th:value="${memberCreated}" placeholder="例：2026-11-05"></label></section>
<section class="column-sort-setting"><h3>並び替え</h3><label class="choice-row"><input type="radio" name="direction" value="asc" th:checked="${direction=='asc'}">昇順</label><label class="choice-row"><input type="radio" name="direction" value="desc" th:checked="${direction=='desc'}">降順</label></section><div class="dialog-actions"><button type="button" class="secondary" onclick="this.closest('dialog').close()">キャンセル</button><button>適用</button></div></form></dialog>
<script>let currentMemberColumn='';function memberCsv(selector){const values=[...document.querySelectorAll(selector+':checked')].map(x=>x.value);return values.length?values.join(','):'NONE';}function openMemberSettings(column,title){currentMemberColumn=column;const d=document.getElementById('member-column-settings');d.querySelectorAll('.column-setting').forEach(x=>x.hidden=x.dataset.column!==column);document.getElementById('member-column-title').textContent=title+'の設定';document.getElementById('member-sort-value').value=column;d.showModal();}document.getElementById('member-column-form').addEventListener('submit',()=>{if(currentMemberColumn==='status')document.getElementById('member-statuses-value').value=memberCsv('.member-status-choice');if(currentMemberColumn==='leader_flag')document.getElementById('member-roles-value').value=memberCsv('.member-role-choice');if(currentMemberColumn==='approve_flag')document.getElementById('member-approvals-value').value=memberCsv('.member-approval-choice');});</script>
<script>document.querySelectorAll('.member-table-full tbody tr').forEach(row=>{const cell=row.cells[1];if(!cell||cell.querySelector('a')||row.cells.length<8)return;const id=cell.textContent.trim();const link=document.createElement('a');link.href='/group/members/'+encodeURIComponent(id);link.textContent=id;cell.textContent='';cell.appendChild(link)});(()=>{const list=document.getElementById('member-sortable');if(!list||list.dataset.manual!=='true')return;let dragged=null;const save=()=>{const body=new URLSearchParams({page:list.dataset.page});[...list.querySelectorAll('tr[data-id]')].forEach(row=>body.append('ids',row.dataset.id));const csrf=document.querySelector('input[name="_csrf"]');if(csrf)body.append(csrf.name,csrf.value);fetch('/group/members/order',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}).then(r=>{if(!r.ok)location.reload()})};list.addEventListener('dragstart',e=>{dragged=e.target.closest('tr[data-id]');if(!dragged){e.preventDefault();return}dragged.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragged.dataset.id)});list.addEventListener('dragover',e=>{e.preventDefault();const target=e.target.closest('tr[data-id]');if(!dragged||!target||target===dragged)return;const r=target.getBoundingClientRect();list.insertBefore(dragged,e.clientY<r.top+r.height/2?target:target.nextSibling)});list.addEventListener('drop',e=>e.preventDefault());list.addEventListener('dragend',()=>{dragged?.classList.remove('dragging');dragged=null;save()})})();</script></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
