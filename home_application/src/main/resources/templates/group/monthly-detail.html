<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月次処理詳細</title>
<link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}">
<style>.detail-wrap{width:min(1300px,94vw);margin:auto}.condition-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.condition{padding:16px;border:1px solid #d9dfe4;border-radius:10px}.condition strong{display:block;margin-bottom:8px}.ok{color:#198754}.ng{color:#dc3545}.table-scroll{overflow:auto}.summary-table{width:100%;min-width:900px;border-collapse:collapse}.summary-table th,.summary-table td{padding:11px;border-bottom:1px solid #dce1e5;text-align:right;white-space:nowrap}.summary-table th:first-child,.summary-table td:first-child{text-align:left}.monthly-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:18px}.monthly-actions .button,.monthly-actions button{min-height:48px;padding:.75rem 1.2rem}@media(max-width:900px){.condition-grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.condition-grid{grid-template-columns:1fr}}</style></head>
<body><header th:replace="~{fragments :: header}"></header><main><div class="title-area"><h1 th:text="|${year}年${month}月 月次処理|">月次処理</h1></div><div class="detail-wrap">
<div class="success" th:if="${param.closed}">月次データを確定しました。</div><div class="success" th:if="${param.reopened}">月次確定を解除しました。</div><div class="alert" th:if="${param.error}">確定条件を満たしていません。</div>
<section class="panel"><h2>確定条件</h2><div class="condition-grid">
<div class="condition"><strong>月末日以降</strong><span th:class="${dateReady?'ok':'ng'}" th:text="${dateReady?'○ 条件を満たしています':'× 月末日前です'}"></span></div>
<div class="condition"><strong>未精算データなし</strong><span th:class="${unsettled==0?'ok':'ng'}" th:text="${unsettled==0?'○ 条件を満たしています':'× 未精算 '+unsettled+'件'}"></span></div>
<div class="condition"><strong>全カテゴリーの予算入力</strong><span th:class="${budgetReady?'ok':'ng'}" th:text="${budgetReady?'○ 条件を満たしています':'× 予算が未入力です'}"></span></div>
<div class="condition"><strong>参照データが正常</strong><span th:class="${invalidReferences==0?'ok':'ng'}" th:text="${invalidReferences==0?'○ 条件を満たしています':'× 要修正データ '+invalidReferences+'件'}"></span></div>
</div></section>
<section class="panel"><h2>メンバー別精算状況</h2><div class="table-scroll"><table class="summary-table"><thead><tr><th>メンバー</th><th>支出件数</th><th>支出合計</th><th>収入件数</th><th>収入合計</th><th>未精算件数</th><th>未精算金額</th></tr></thead><tbody><tr th:each="r:${members}"><td th:text="${r.user_name}"></td><td th:text="${r.expense_count}"></td><td th:text="|${#numbers.formatInteger(r.expense_amount,1,'COMMA')}円|"></td><td th:text="${r.income_count}"></td><td th:text="|${#numbers.formatInteger(r.income_amount,1,'COMMA')}円|"></td><td th:text="${r.unsettled_count}"></td><td th:text="|${#numbers.formatInteger(r.unsettled_amount,1,'COMMA')}円|"></td></tr></tbody></table></div>
<div class="monthly-actions"><a class="button secondary" th:href="@{/group/monthly(year=${year})}">戻る</a><form th:if="${!closed}" method="post" th:action="@{|/group/monthly/${year}/${month}/close|}" onsubmit="return confirm('この月を確定しますか？確定後は購入データを編集できません。')"><button th:disabled="${!dateReady or unsettled!=0 or !budgetReady or invalidReferences!=0}">月次確定</button></form><form th:if="${closed}" method="post" th:action="@{|/group/monthly/${year}/${month}/reopen|}" onsubmit="return confirm('月次確定を解除しますか？')"><button class="danger">確定解除</button></form></div></section>
</div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
