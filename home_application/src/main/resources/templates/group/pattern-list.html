<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}"></title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><link rel="stylesheet" th:href="@{/css/management-components.css}">
</head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-area"><h1 th:text="${title}"></h1></div><div class="success management-message" th:if="${param.created}">登録しました。</div><div class="success management-message" th:if="${param.updated}">更新しました。</div><div class="success management-message" th:if="${param.deleted}">削除しました。</div><div class="alert management-message" th:if="${param.error}" th:text="${param.error[0]=='duplicate'?'同じ表示名は登録できません。':param.error[0]=='invalidReference'?'無効または削除された設定値を参照しているため有効化できません。':param.error[0]=='disableFirst'?'削除する前に無効化してください。':'入力内容を確認してください。'}"></div>
<section class="panel"><div class="pattern-toolbar"><p th:text="${description+' 左のハンドルをドラッグして表示順を変更できます。'}"></p><button type="button" class="add-button" id="pattern-add">＋</button></div><ul id="pattern-list" class="pattern-list" data-touch-sortable th:attr="data-order-url=@{/group/patterns/{type}/order(type=${type})}"><li class="pattern-card" th:each="item:${items}" th:classappend="${item.disabled_flag==1}?' disabled':''" draggable="true" th:attr="data-id=${item.id}"><span class="drag-handle">☰</span><div class="pattern-main"><h3 th:text="${item.display_name}"></h3><div class="pattern-summary"><span th:if="${item.category_names}" th:text="${'カテゴリー：'+item.category_names}"></span><span th:if="${item.payment_names}" th:text="${'支払い方法：'+item.payment_names}"></span><span th:if="${item.transaction_type}" th:text="${'種別：'+(item.transaction_type=='EXPENSE'?'支出':'収入')}"></span><span th:if="${item.amount}" th:text="${'金額：'+item.amount+'円'}"></span><span th:if="${item.amount_from != null or item.amount_to != null}" th:text="${'金額範囲：'+(item.amount_from?:'指定なし')+' ～ '+(item.amount_to?:'指定なし')+'円'}"></span><span th:if="${item.member_names}" th:text="${'メンバー：'+item.member_names}"></span><span th:if="${item.label_names}" th:text="${'ラベル：'+item.label_names}"></span><span th:if="${item.date_from != null or item.date_to != null}" th:text="${'期間：'+(item.date_from?:'指定なし')+' ～ '+(item.date_to?:'指定なし')}"></span></div><span class="auto-disabled" th:if="${item.auto_disabled==1}">参照先の無効化により自動無効</span></div><div class="pattern-actions"><span class="status-label" th:classappend="${item.disabled_flag==1}?' inactive':' active'" th:text="${item.disabled_flag==1?'無効':'有効'}"></span><button type="button" class="secondary edit-pattern" th:attr="data-id=${item.id},data-name=${item.display_name},data-categories=${item.category_ids},data-payments=${item.payment_method_ids},data-members=${item.member_ids},data-labels=${item.label_ids},data-transaction=${item.transaction_type},data-amount=${item.amount},data-amount-from=${item.amount_from},data-amount-to=${item.amount_to},data-settlement=${item.settlement_status},data-from=${item.date_from},data-to=${item.date_to},data-note=${item.note}">編集</button><form th:action="@{|/group/patterns/${type}/${item.id}/toggle|}" method="post"><button class="secondary" th:text="${item.disabled_flag==1?'有効化':'無効化'}"></button></form><form th:action="@{|/group/patterns/${type}/${item.id}/delete|}" method="post" onsubmit="return confirm('このパターンを削除しますか？')"><button class="danger" th:disabled="${item.disabled_flag!=1}">削除</button></form></div></li></ul><p th:if="${#lists.isEmpty(items)}">登録されているパターンはありません。</p></section>
</main><footer th:replace="~{fragments :: footer}"></footer>
<dialog id="pattern-dialog" class="pattern-dialog" th:attr="data-base=@{/group/patterns/{type}(type=${type})}">
  <form id="pattern-form" class="pattern-form" method="post" th:action="@{/group/patterns/{type}(type=${type})}">
    <h2 id="pattern-dialog-title">パターン登録</h2>
    <div class="pattern-fields">
      <label class="full">表示名 <span class="required">必須</span><input name="displayName" required maxlength="100"></label>
      <div class="pattern-pair" th:if="${searchPattern}">
        <label>購入日（From）<input type="date" name="dateFrom"></label>
        <label>購入日（To）<input type="date" name="dateTo"></label>
      </div>
      <div class="pattern-pair" th:if="${searchPattern}">
        <label>金額（From）<input type="number" name="amountFrom" min="0" step="1"></label>
        <label>金額（To）<input type="number" name="amountTo" min="0" step="1"></label>
      </div>
      <label class="half">購入者（メンバー）<select name="memberIds" th:multiple="${searchPattern}" th:attr="data-select-threshold=${searchPattern?1:null},data-search-placeholder=${searchPattern?'購入者を検索・選択':null}"><option value="">指定なし</option><option th:each="x:${members}" th:value="${x.id}" th:text="${x.name}"></option></select></label>
      <label class="half">カテゴリー<select name="categoryIds" th:multiple="${searchPattern}" th:attr="data-select-threshold=${searchPattern?1:null},data-search-placeholder=${searchPattern?'カテゴリーを検索・選択':null}"><option value="">指定なし</option><option th:each="x:${categories}" th:value="${x.id}" th:text="${x.name}"></option></select></label>
      <div class="pattern-pair">
        <label>種別<select name="transactionType"><option value="">指定なし</option><option value="EXPENSE">支出</option><option value="INCOME">収入</option></select></label>
        <label>支払い方法<select name="paymentIds" th:multiple="${searchPattern}" th:attr="data-select-threshold=${searchPattern?1:null},data-search-placeholder=${searchPattern?'支払い方法を検索・選択':null}"><option value="">指定なし</option><option th:each="x:${payments}" th:value="${x.id}" th:text="${x.name}"></option></select></label>
      </div>
      <div class="pattern-pair" th:unless="${searchPattern}">
        <label>金額<input type="number" name="amount" min="0" step="1"></label>
        <label>精算<select name="settlementStatus"><option value="">指定なし</option><option value="UNSETTLED">未精算</option><option value="SETTLED">精算済</option></select></label>
      </div>
      <label class="half" th:if="${searchPattern}">精算<select name="settlementStatus"><option value="">指定なし</option><option value="UNSETTLED">未精算</option><option value="SETTLED">精算済</option></select></label>
      <label class="full">ラベル<select name="labelIds" multiple data-select-threshold="1" data-search-placeholder="ラベルを検索・選択"><option th:each="x:${labels}" th:value="${x.id}" th:text="${x.name}"></option></select></label>
      <label class="full">備考<input name="note" maxlength="500"></label>
    </div>
    <div class="dialog-actions"><button type="button" class="secondary" id="pattern-cancel">キャンセル</button><button type="submit">保存</button></div>
  </form>
</dialog>
<script th:inline="javascript">
const dialog=document.getElementById('pattern-dialog'),form=document.getElementById('pattern-form'),base=dialog.dataset.base,title=document.getElementById('pattern-dialog-title');function setValues(select,csv){const values=(csv||'').split(',');[...select.options].forEach(o=>o.selected=values.includes(o.value));select.dispatchEvent(new Event('change',{bubbles:true}));}function openPattern(button){form.reset();form.action=base;if(button){title.textContent='パターン編集';form.action=base+'/'+encodeURIComponent(button.dataset.id)+'/update';form.displayName.value=button.dataset.name||'';setValues(form.categoryIds,button.dataset.categories);setValues(form.paymentIds,button.dataset.payments);setValues(form.memberIds,button.dataset.members);setValues(form.labelIds,button.dataset.labels);form.transactionType.value=button.dataset.transaction||'';if(form.amount)form.amount.value=button.dataset.amount||'';if(form.amountFrom)form.amountFrom.value=button.dataset.amountFrom||'';if(form.amountTo)form.amountTo.value=button.dataset.amountTo||'';form.settlementStatus.value=button.dataset.settlement||'';if(form.dateFrom)form.dateFrom.value=button.dataset.from||'';if(form.dateTo)form.dateTo.value=button.dataset.to||'';form.note.value=button.dataset.note||'';}else title.textContent='パターン登録';dialog.showModal();requestAnimationFrame(()=>form.displayName.focus())}document.getElementById('pattern-add').addEventListener('click',()=>openPattern());document.querySelectorAll('.edit-pattern').forEach(b=>b.addEventListener('click',()=>{openPattern(b);dialog.showModal()}));document.getElementById('pattern-cancel').addEventListener('click',()=>dialog.close());
const list=document.getElementById('pattern-list');let dragged=null;list.addEventListener('dragstart',e=>dragged=e.target.closest('.pattern-card'));list.addEventListener('dragover',e=>{e.preventDefault();const t=e.target.closest('.pattern-card');if(!dragged||!t||t===dragged)return;const r=t.getBoundingClientRect();list.insertBefore(dragged,e.clientY<r.top+r.height/2?t:t.nextSibling)});list.addEventListener('dragend',()=>{const body=new URLSearchParams();[...list.children].forEach(x=>body.append('ids',x.dataset.id));const csrf=form.querySelector('[name="_csrf"]');if(csrf)body.append(csrf.name,csrf.value);fetch(base+'/order',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});dragged=null});
const retained=/*[[${patternForm}]]*/ null,retainedId=/*[[${patternFormId}]]*/ null;
if(retained){openPattern();if(retainedId){form.action=base+'/'+encodeURIComponent(retainedId)+'/update';title.textContent='パターン編集'}Object.entries(retained).forEach(([name,values])=>{const field=form.elements.namedItem(name);if(!field)return;const list=Array.isArray(values)?values:[values];if(field instanceof RadioNodeList){[...field].forEach(x=>x.checked=list.includes(x.value))}else if(field.tagName==='SELECT'&&field.multiple){[...field.options].forEach(x=>x.selected=list.includes(x.value));field.dispatchEvent(new Event('change',{bubbles:true}))}else field.value=list[0]??''})}
</script></body></html>
