<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}"></title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><link rel="stylesheet" th:href="@{/css/management-components.css}"><script th:src="@{/js/management-live-filter.js}" defer></script>
<style>.amount-button{width:100%;text-align:right;background:#fff;color:#1f2933;border:1px solid #bbc4ce}.amount-dialog{width:min(460px,calc(100vw - 28px));padding:0;border:0;border-radius:14px}.amount-dialog::backdrop{background:rgba(20,28,40,.48);backdrop-filter:blur(4px)}.amount-body{padding:24px}.amount-body input{font-size:1.4rem;text-align:right}.quick-amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.amount-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}</style>
</head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-area"><h1 th:text="${title}"></h1></div><div class="success management-message" th:if="${param.created}">登録しました。</div><div class="success management-message" th:if="${param.updated}">更新しました。</div><div class="success management-message" th:if="${param.deleted}">削除しました。</div><div class="alert management-message" th:if="${param.error}" th:text="${param.error[0]=='duplicate'?'同じ表示名は登録できません。':param.error[0]=='invalidReference'?'無効または削除された設定値を参照しているため有効化できません。':param.error[0]=='disableFirst'?'削除する前に無効化してください。':'入力内容を確認してください。'}"></div>
<section class="panel"><div class="pattern-toolbar"><div class="management-list-controls"><label class="management-list-search"><span class="sr-only">表示名を検索</span><input type="search" placeholder="表示名を検索" autocomplete="off" data-live-filter="#pattern-list" aria-label="表示名を検索"></label><button type="button" class="add-button" id="pattern-add" aria-label="新規登録">＋</button></div><p th:text="${description+' 左のハンドルをドラッグして表示順を変更できます。'}"></p></div><ul id="pattern-list" class="pattern-list" data-touch-sortable th:attr="data-order-url=@{/group/patterns/{type}/order(type=${type})}"><li class="pattern-card" th:each="item:${items}" th:classappend="${item.disabled_flag==1}?' disabled':''" draggable="true" th:attr="data-id=${item.id},data-filter-text=${item.display_name}" data-filter-item><span class="drag-handle">☰</span><div class="pattern-main"><h3 th:text="${item.display_name}"></h3><div class="pattern-summary"><span th:if="${item.category_names}" th:text="${'カテゴリー：'+item.category_names}"></span><span th:if="${item.payment_names}" th:text="${'支払い方法：'+item.payment_names}"></span><span th:if="${item.transaction_type}" th:text="${'種別：'+(item.transaction_type=='EXPENSE'?'支出':'収入')}"></span><span th:if="${item.amount}" th:text="${'金額：'+item.amount+'円'}"></span><span th:if="${item.amount_from != null or item.amount_to != null}" th:text="${'金額範囲：'+(item.amount_from?:'指定なし')+' ～ '+(item.amount_to?:'指定なし')+'円'}"></span><span th:if="${item.member_names}" th:text="${'メンバー：'+item.member_names}"></span><span th:if="${item.label_names}" th:text="${'ラベル：'+item.label_names}"></span></div><div class="pattern-reference-errors" th:if="${item.auto_disabled == 1}"><strong>使用できない設定があります</strong><ul><li th:each="message:${item.reference_errors}" th:text="${message}"></li></ul></div></div><div class="pattern-actions"><span class="status-label" th:classappend="${item.disabled_flag==1}?' inactive':' active'" th:text="${item.disabled_flag==1?'無効':'有効'}"></span><button type="button" class="secondary edit-pattern" th:attr="data-id=${item.id},data-name=${item.display_name},data-categories=${item.category_ids},data-payments=${item.payment_method_ids},data-members=${item.member_ids},data-labels=${item.label_ids},data-transaction=${item.transaction_type},data-amount=${item.amount},data-amount-from=${item.amount_from},data-amount-to=${item.amount_to},data-settlement=${item.settlement_status},data-note=${item.note}">編集</button><form th:action="@{|/group/patterns/${type}/${item.id}/toggle|}" method="post"><button class="secondary" th:text="${item.disabled_flag==1?'有効化':'無効化'}"></button></form><form th:action="@{|/group/patterns/${type}/${item.id}/delete|}" method="post" onsubmit="return confirm('このパターンを削除しますか？')"><button class="danger" th:disabled="${item.disabled_flag!=1}">削除</button></form></div></li></ul><p class="management-filter-empty" data-filter-empty="#pattern-list" hidden>検索条件に一致するデータはありません。</p><p th:if="${#lists.isEmpty(items)}">登録されているパターンはありません。</p></section>
</main><footer th:replace="~{fragments :: footer}"></footer>
<dialog id="pattern-dialog" class="pattern-dialog" th:attr="data-base=@{/group/patterns/{type}(type=${type})}">
  <form id="pattern-form" class="pattern-form" method="post" th:action="@{/group/patterns/{type}(type=${type})}">
    <h2 id="pattern-dialog-title">パターン登録</h2>
    <div class="pattern-fields">
      <label class="full">表示名 <span class="required">必須</span><input name="displayName" required maxlength="100"></label>
      <div class="pattern-pair" th:if="${searchPattern}">
        <label>金額（From）<input type="number" name="amountFrom" min="0" step="1"></label>
        <label>金額（To）<input type="number" name="amountTo" min="0" step="1"></label>
      </div>
      <label class="half">購入者（メンバー）<select name="memberIds" th:multiple="${searchPattern}" th:required="${patternCode == 'TEMPLATE'}" th:attr="data-select-threshold=${searchPattern?1:null},data-search-placeholder=${searchPattern?'購入者を検索・選択':null}"><option value="" th:unless="${patternCode == 'TEMPLATE'}">指定なし</option><option th:each="x:${members}" th:value="${x.id}" th:text="${x.name}"></option></select></label>
      <label class="half">カテゴリー<select name="categoryIds" th:multiple="${searchPattern}" th:required="${patternCode == 'TEMPLATE'}" th:attr="data-select-threshold=${searchPattern?1:null},data-search-placeholder=${searchPattern?'カテゴリーを検索・選択':null}"><option value="" th:unless="${patternCode == 'TEMPLATE'}">指定なし</option><option th:each="x:${categories}" th:value="${x.id}" th:text="${x.name}"></option></select></label>
      <div class="pattern-pair">
        <label>種別<select name="transactionType" th:required="${patternCode == 'TEMPLATE'}"><option value="" th:unless="${patternCode == 'TEMPLATE'}">指定なし</option><option value="EXPENSE">支出</option><option value="INCOME">収入</option></select></label>
        <label>支払い方法<select name="paymentIds" th:multiple="${searchPattern}" th:required="${patternCode == 'TEMPLATE'}" th:attr="data-select-threshold=${searchPattern?1:null},data-search-placeholder=${searchPattern?'支払い方法を検索・選択':null}"><option value="" th:unless="${patternCode == 'TEMPLATE'}">指定なし</option><option th:each="x:${payments}" th:value="${x.id}" th:text="${x.name}"></option></select></label>
      </div>
      <div class="pattern-pair" th:unless="${searchPattern}">
        <label th:if="${patternCode == 'TEMPLATE'}">金額<input type="hidden" id="pattern-amount" name="amount" required><button type="button" id="pattern-amount-open" class="amount-button">金額を入力</button></label>
        <label th:unless="${patternCode == 'TEMPLATE'}">金額<input type="number" name="amount" min="0" step="1"></label>
        <label>精算<select name="settlementStatus" th:required="${patternCode == 'TEMPLATE'}"><option value="" th:unless="${patternCode == 'TEMPLATE'}">指定なし</option><option value="UNSETTLED">未精算</option><option value="SETTLED">精算済</option></select></label>
      </div>
      <label class="half" th:if="${searchPattern}">精算<select name="settlementStatus"><option value="">指定なし</option><option value="UNSETTLED">未精算</option><option value="SETTLED">精算済</option></select></label>
      <label class="full">ラベル<select name="labelIds" multiple data-select-threshold="1" data-search-placeholder="ラベルを検索・選択"><option th:each="x:${labels}" th:value="${x.id}" th:text="${x.name}"></option></select></label>
      <label class="full">備考<input name="note" maxlength="500"></label>
    </div>
    <div class="dialog-actions"><button type="button" class="secondary" id="pattern-cancel">キャンセル</button><button type="submit">保存</button></div>
  </form>
</dialog>
<dialog id="pattern-amount-dialog" class="amount-dialog" th:if="${patternCode == 'TEMPLATE'}">
  <div class="amount-body"><h2>金額入力</h2><input id="pattern-amount-input" type="number" min="1" max="2147483647">
    <div class="quick-amounts"><button type="button" data-pattern-add="100">＋100</button><button type="button" data-pattern-add="500">＋500</button><button type="button" data-pattern-add="1000">＋1,000</button><button type="button" data-pattern-add="5000">＋5,000</button><button type="button" data-pattern-add="10000">＋10,000</button><button type="button" class="secondary" id="pattern-amount-clear">クリア</button></div>
    <div class="amount-actions"><button type="button" class="secondary" id="pattern-amount-cancel">キャンセル</button><button type="button" id="pattern-amount-set">設定</button></div>
  </div>
</dialog>
<script th:inline="javascript">
const dialog=document.getElementById('pattern-dialog'),form=document.getElementById('pattern-form'),base=dialog.dataset.base,title=document.getElementById('pattern-dialog-title'),amountHidden=document.getElementById('pattern-amount'),amountOpen=document.getElementById('pattern-amount-open');function syncAmount(){if(amountOpen)amountOpen.textContent=amountHidden.value?Number(amountHidden.value).toLocaleString('ja-JP')+'円':'金額を入力'}function setValues(select,csv){const values=(csv||'').split(',');[...select.options].forEach(o=>o.selected=values.includes(o.value));select.dispatchEvent(new Event('change',{bubbles:true}));}function openPattern(button){form.reset();form.action=base;if(button){title.textContent='パターン編集';form.action=base+'/'+encodeURIComponent(button.dataset.id)+'/update';form.displayName.value=button.dataset.name||'';setValues(form.categoryIds,button.dataset.categories);setValues(form.paymentIds,button.dataset.payments);setValues(form.memberIds,button.dataset.members);setValues(form.labelIds,button.dataset.labels);form.transactionType.value=button.dataset.transaction||'';if(form.amount)form.amount.value=button.dataset.amount||'';if(form.amountFrom)form.amountFrom.value=button.dataset.amountFrom||'';if(form.amountTo)form.amountTo.value=button.dataset.amountTo||'';form.settlementStatus.value=button.dataset.settlement||'';form.note.value=button.dataset.note||'';}else title.textContent='パターン登録';syncAmount();dialog.showModal();requestAnimationFrame(()=>form.displayName.focus())}document.getElementById('pattern-add').addEventListener('click',()=>openPattern());document.querySelectorAll('.edit-pattern').forEach(b=>b.addEventListener('click',()=>{openPattern(b);dialog.showModal()}));document.getElementById('pattern-cancel').addEventListener('click',()=>dialog.close());
if(amountOpen){const amountDialog=document.getElementById('pattern-amount-dialog'),amountInput=document.getElementById('pattern-amount-input');amountOpen.addEventListener('click',()=>{amountInput.value=amountHidden.value;amountDialog.showModal();amountInput.focus();amountInput.select()});document.querySelectorAll('[data-pattern-add]').forEach(button=>button.addEventListener('click',()=>amountInput.value=(Number(amountInput.value)||0)+Number(button.dataset.patternAdd)));document.getElementById('pattern-amount-clear').addEventListener('click',()=>amountInput.value='');document.getElementById('pattern-amount-cancel').addEventListener('click',()=>amountDialog.close());document.getElementById('pattern-amount-set').addEventListener('click',()=>{const value=Math.max(1,Number(amountInput.value)||1);amountHidden.value=value;syncAmount();amountDialog.close()})}
const list=document.getElementById('pattern-list');let dragged=null;list.addEventListener('dragstart',e=>dragged=e.target.closest('.pattern-card'));list.addEventListener('dragover',e=>{e.preventDefault();const t=e.target.closest('.pattern-card');if(!dragged||!t||t===dragged)return;const r=t.getBoundingClientRect();list.insertBefore(dragged,e.clientY<r.top+r.height/2?t:t.nextSibling)});list.addEventListener('dragend',()=>{const body=new URLSearchParams();[...list.children].forEach(x=>body.append('ids',x.dataset.id));const csrf=form.querySelector('[name="_csrf"]');if(csrf)body.append(csrf.name,csrf.value);fetch(base+'/order',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});dragged=null});
const retained=/*[[${patternForm}]]*/ null,retainedId=/*[[${patternFormId}]]*/ null;
if(retained){openPattern();if(retainedId){form.action=base+'/'+encodeURIComponent(retainedId)+'/update';title.textContent='パターン編集'}Object.entries(retained).forEach(([name,values])=>{const field=form.elements.namedItem(name);if(!field)return;const list=Array.isArray(values)?values:[values];if(field instanceof RadioNodeList){[...field].forEach(x=>x.checked=list.includes(x.value))}else if(field.tagName==='SELECT'&&field.multiple){[...field.options].forEach(x=>x.selected=list.includes(x.value));field.dispatchEvent(new Event('change',{bubbles:true}))}else field.value=list[0]??''});syncAmount()}
</script></body></html>
