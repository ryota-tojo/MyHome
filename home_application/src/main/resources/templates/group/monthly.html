<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月次処理</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><style>.monthly-wrap{width:min(1100px,80vw);margin:auto}.year-row{display:flex;justify-content:space-between;align-items:end;gap:12px}.year-form{display:flex;align-items:end;gap:10px}.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.month-card{display:flex;align-items:center;justify-content:space-between;padding:18px;border:1px solid #d8dee4;border-radius:10px;background:#fff;text-decoration:none;color:inherit}.mark{font-size:1.5rem;font-weight:800}.mark.done{color:#198754}.mark.open{color:#dc3545}@media(max-width:700px){.monthly-wrap{width:94vw}.month-grid{grid-template-columns:repeat(2,1fr)}.year-row{align-items:stretch;flex-direction:column}}</style></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-area"><h1>月次処理</h1></div><div class="monthly-wrap"><section class="panel"><div class="year-row"><div><h2 th:text="|${year}年の月次処理状況|">対象年</h2><p>○は完了、×は未完了です。</p></div><form class="year-form" method="get" th:action="@{/group/monthly}"><label>対象年<input type="number" name="year" min="2000" max="2100" th:value="${year}"></label><button>表示</button></form></div><div class="month-grid"><a class="month-card" th:each="x:${months}" th:href="@{|/group/monthly/${year}/${x.month}|}"><strong th:text="|${x.month}月|"></strong><span class="mark" th:classappend="${x.closed}?' done':' open'" th:text="${x.closed?'○':'×'}"></span></a></div></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
