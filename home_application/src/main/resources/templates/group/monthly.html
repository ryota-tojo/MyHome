<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>月次処理</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/theme.css}">
  <link rel="stylesheet" th:href="@{/css/polish.css}">
  <link rel="stylesheet" th:href="@{/css/actions.css}">
  <style>
    .monthly-wrap{width:min(1100px,80vw);margin:auto}.year-row{display:flex;justify-content:space-between;align-items:end;gap:12px}.year-form{display:flex;align-items:end;gap:10px}.bulk-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;padding:14px 16px;border:1px solid #d8dee4;border-radius:10px;background:#f8fafb}.bulk-toolbar__selection{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.bulk-toolbar label{display:inline-flex;align-items:center;gap:7px;width:auto;margin:0}.bulk-toolbar input{width:auto;margin:0}.bulk-count{color:#66727c}.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.month-card{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;border:1px solid #d8dee4;border-radius:10px;background:#fff}.month-select{display:flex;align-items:center;justify-content:center;width:34px;height:44px;margin:0}.month-select input{width:20px;height:20px;margin:0}.month-select input:disabled{cursor:not-allowed}.month-card-link{display:flex;align-items:center;justify-content:space-between;min-width:0;padding:10px 8px;color:inherit;text-decoration:none}.month-card:not(.is-closed):has(input:checked){border-color:#1671e8;background:#f0f7ff;box-shadow:0 0 0 2px rgba(22,113,232,.12)}.month-card.is-blocked{background:#f6f7f8}.mark{font-size:1.5rem;font-weight:800}.mark.done{color:#198754}.mark.open{color:#dc3545}.condition-note{display:block;color:#8a6065;font-size:.72rem;font-weight:500}
    @media(max-width:700px){.monthly-wrap{width:94vw}.month-grid{grid-template-columns:repeat(2,1fr)}.year-row{align-items:stretch;flex-direction:column}.bulk-toolbar{align-items:stretch;flex-direction:column}.bulk-toolbar button{align-self:flex-end}}
  </style>
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
  <div class="title-area"><h1>月次処理</h1></div>
  <div class="monthly-wrap">
    <div class="success" th:if="${param.bulkClosed}" th:text="${'選択した' + param.bulkClosed[0] + 'か月を一括で月次確定しました。'}"></div>
    <div class="alert" th:if="${param.error != null and param.error[0] == 'unselected'}">月次確定する月を選択してください。</div>
    <div class="alert" th:if="${param.error != null and param.error[0] == 'condition'}">選択した月に確定条件を満たしていない月があります。詳細画面を確認してください。</div>
    <section class="panel">
      <div class="year-row">
        <div><h2 th:text="|${year}年の月次処理状況|">対象年</h2><p>○は完了、×は未完了です。確定可能な月を複数選択できます。</p></div>
        <form class="year-form" method="get" th:action="@{/group/monthly}"><label>対象年<input type="number" name="year" min="2000" max="2100" th:value="${year}"></label><button>表示</button></form>
      </div>
      <form id="bulk-close-form" method="post" th:action="@{/group/monthly/{year}/close-bulk(year=${year})}" onsubmit="return confirmBulkClose()">
        <div class="bulk-toolbar">
          <div class="bulk-toolbar__selection"><label><input type="checkbox" id="select-all-months">確定可能な月をすべて選択</label><span class="bulk-count">選択中：<strong id="selected-month-count">0</strong>か月</span></div>
          <button id="bulk-close-button" disabled>選択した月を一括確定</button>
        </div>
        <div class="month-grid">
          <div class="month-card" th:each="x:${months}" th:classappend="${x.closed ? ' is-closed' : (!x.closable ? ' is-blocked' : '')}">
            <label class="month-select" th:if="${!x.closed}" th:title="${x.closable ? '一括確定の対象に選択' : '確定条件を満たしていません'}"><input class="month-checkbox" type="checkbox" name="months" th:value="${x.month}" th:disabled="${!x.closable}" autocomplete="off"></label>
            <span class="month-select" th:if="${x.closed}"></span>
            <a class="month-card-link" th:href="@{|/group/monthly/${year}/${x.month}|}"><span><strong th:text="|${x.month}月|">1月</strong><small class="condition-note" th:if="${!x.closed and !x.closable}">確定条件未達</small></span><span class="mark" th:classappend="${x.closed}?' done':' open'" th:text="${x.closed?'○':'×'}"></span></a>
          </div>
        </div>
      </form>
    </section>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script>
(()=>{const boxes=[...document.querySelectorAll('.month-checkbox:not(:disabled)')],all=document.getElementById('select-all-months'),count=document.getElementById('selected-month-count'),button=document.getElementById('bulk-close-button');const update=()=>{const selected=boxes.filter(box=>box.checked).length;count.textContent=String(selected);button.disabled=selected===0;all.checked=boxes.length>0&&selected===boxes.length;all.indeterminate=selected>0&&selected<boxes.length};boxes.forEach(box=>box.addEventListener('change',update));all.addEventListener('change',()=>{boxes.forEach(box=>box.checked=all.checked);update()});window.confirmBulkClose=()=>{const selected=boxes.filter(box=>box.checked).length;if(selected===0){alert('月次確定する月を選択してください。');return false}return confirm(`選択した${selected}か月を一括で月次確定しますか？\n確定後は対象月の購入データを編集できません。`)};update()})();
</script>
</body>
</html>
