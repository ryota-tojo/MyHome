<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>予実対比</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/theme.css}">
<link rel="stylesheet" th:href="@{/css/polish.css}">
<link rel="stylesheet" th:href="@{/css/actions.css}">
<style>
.analysis-wrap{width:min(1500px,94vw);margin:auto}
.condition-form{display:flex;align-items:end;gap:18px}
.month-checks{display:flex;flex-wrap:wrap;gap:8px 14px}
.month-checks label{display:flex;flex-direction:row;align-items:center;gap:5px;margin:0}
.month-checks input{width:auto}
.legend{display:flex;gap:18px;margin:10px 0 18px}
.legend span:before{content:'';display:inline-block;width:14px;height:10px;margin-right:6px;border-radius:2px}
.legend .budget:before{background:#6da9e8}
.legend .actual:before{background:#f28b66}
.horizontal-list{display:grid;gap:18px}
.horizontal-row{display:grid;grid-template-columns:minmax(130px,220px) 1fr;gap:12px}
.bar-area{display:grid;gap:5px}
.bar{position:relative;height:28px;min-width:0;border-radius:5px}
.bar-value{position:absolute;top:50%;left:9px;z-index:1;transform:translateY(-50%);color:#17212b;font-size:.78rem;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.9)}
.bar.budget{background:#6da9e8}
.bar.actual{background:#f28b66}
.metrics{grid-column:2;display:flex;flex-wrap:wrap;gap:5px 18px;color:#52606c;font-size:.86rem}
.chart-scroll{overflow:auto}
.vertical-chart{display:flex;align-items:flex-end;gap:18px;height:370px;min-width:max-content;padding:54px 20px 45px;border-left:1px solid #bfc7cf;border-bottom:1px solid #bfc7cf}
.chart-group{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px;width:126px;height:100%}
.vbar{position:relative;width:46px;min-height:1px;border-radius:6px 6px 0 0}
.vbar-value{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:2px 4px;border-radius:4px;background:rgba(255,255,255,.9);color:#26313c;font-size:.68rem;font-weight:800;line-height:1.15;white-space:nowrap;box-shadow:0 1px 4px rgba(20,28,40,.12)}
.vbar.budget{background:#6da9e8}
.vbar.actual{background:#f28b66}
.chart-label{position:absolute;top:calc(100% + 8px);left:50%;width:90px;transform:translateX(-50%);text-align:center;font-size:.76rem;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:#68737e;padding:25px}
.annual-cards{display:grid;gap:18px}.annual-card{padding:20px;border:1px solid #d9e0e6;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(20,28,40,.07)}.annual-card.total-card{border-color:#94bde7;background:#f3f8fe}.annual-card__header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:14px;border-bottom:1px solid #dfe5ea}.annual-card__header h3{margin:0;font-size:1.25rem}.annual-card__totals{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 18px;color:#52606c;font-size:.88rem}.month-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.month-cell{padding:12px;border:1px solid #e2e7eb;border-radius:10px;background:#fafbfc}.month-cell>strong{display:block;margin-bottom:9px}.mini-row{display:grid;grid-template-columns:62px minmax(60px,1fr) auto;align-items:center;gap:7px;margin-top:7px;font-size:.76rem}.mini-track{height:12px;overflow:hidden;border-radius:6px;background:#e8edf1}.mini-track i{display:block;height:100%;border-radius:6px}.mini-track .budget-fill{background:#6da9e8}.mini-track .actual-fill{background:#f28b66}.mini-value{font-weight:700;white-space:nowrap}.month-remaining{display:block;margin-top:8px;color:#66727c;font-size:.76rem;text-align:right}
.annual-chart-scroll{margin-top:16px;overflow-x:auto}.annual-chart{display:grid;grid-template-columns:repeat(12,minmax(64px,1fr));min-width:820px;height:300px;padding:14px 8px 0;border-left:1px solid #cbd3da;border-bottom:1px solid #cbd3da;background:repeating-linear-gradient(to bottom,rgba(116,130,143,.17) 0,rgba(116,130,143,.17) 1px,transparent 1px,transparent 25%)}.annual-month{display:grid;grid-template-rows:1fr 38px;min-width:0;border-right:1px solid rgba(116,130,143,.17)}.annual-bars{display:flex;align-items:flex-end;justify-content:center;gap:4px;min-height:0;padding:0 5px}.annual-vbar{position:relative;width:min(28px,42%);min-height:2px;border-radius:2px 2px 0 0}.annual-vbar.budget{background:#6da9e8}.annual-vbar.actual{background:#f28b66}.annual-vbar:hover{filter:brightness(.96)}.annual-vbar span{position:absolute;left:50%;bottom:calc(100% + 4px);z-index:2;display:none;transform:translateX(-50%);padding:3px 6px;border-radius:5px;background:#26313c;color:#fff;font-size:.68rem;white-space:nowrap}.annual-vbar:hover span{display:block}.annual-month-label{display:flex;align-items:center;justify-content:center;color:#58636d;font-weight:700;font-size:.82rem}
.annual-vbar span{top:6px;bottom:auto;box-shadow:0 2px 6px rgba(20,28,40,.25)}
.annual-cards,.annual-card{min-width:0;max-width:100%}.annual-card{overflow:hidden}.annual-chart-scroll{display:block;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.annual-chart{width:max-content;box-sizing:border-box}
@media(max-width:750px){.analysis-wrap{width:calc(100vw - 28px);max-width:100%}.condition-form{align-items:stretch;flex-direction:column}
.horizontal-row{grid-template-columns:1fr}
.metrics{grid-column:1}
.horizontal-row strong{margin-bottom:2px}
.annual-card__header{flex-direction:column}.annual-card__totals{justify-content:flex-start}.month-grid{grid-template-columns:1fr 1fr}.mini-row{grid-template-columns:54px 1fr}.mini-value{grid-column:2;text-align:right}
}
@media(max-width:480px){.month-grid{grid-template-columns:1fr}}

</style>
</head>
<body>
<header th:replace="~{fragments :: header}">
</header>
<main>
<div class="title-area">
<h1>予実対比</h1>
</div>
<div class="analysis-wrap">
<section class="panel">
<form class="condition-form" method="get" th:action="@{/group/analysis/budget-actual}">
<label>対象年<input type="number" name="year" min="2000" max="2100" th:value="${year}" required>
</label>
<fieldset>
<legend>対象月（複数選択可）</legend>
<div class="month-checks">
<label th:each="m:${#numbers.sequence(1,12)}">
<input type="checkbox" name="months" th:value="${m}" th:checked="${selectedMonths.contains(m)}">
<span th:text="|${m}月|">
</span>
</label>
</div>
</fieldset>
<button>表示</button>
</form>
</section>
<section class="panel">
<h2>カテゴリー別 予算・実績</h2>
<div class="legend">
<span class="budget">予算＋収入</span>
<span class="actual">支出</span>
</div>
<div class="horizontal-list">
<div class="horizontal-row" th:each="r:${rows}">
<strong th:text="${r.category_name}">
</strong>
<div class="bar-area">
<div class="bar budget" th:style="|width:${r.budget_width}%|" th:title="|予算＋収入 ${r.available}円|">
<span class="bar-value" th:text="|${#numbers.formatInteger(r.available,1,'COMMA')}円|">0円</span>
</div>
<div class="bar actual" th:style="|width:${r.expense_width}%|" th:title="|支出 ${r.expense}円|">
<span class="bar-value" th:text="|${#numbers.formatInteger(r.expense,1,'COMMA')}円|">0円</span>
</div>
</div>
<div class="metrics">
<span th:text="|支出 ${#numbers.formatInteger(r.expense,1,'COMMA')}円|">
</span>
<span th:text="|予算 ${#numbers.formatInteger(r.budget,1,'COMMA')}円 ＋ 収入 ${#numbers.formatInteger(r.income,1,'COMMA')}円|">
</span>
<span th:text="|平均／月 ${#numbers.formatInteger(r.average,1,'COMMA')}円|">
</span>
<span th:text="|使用率 ${r.rate}%|">
</span>
<span th:text="|残金 ${#numbers.formatInteger(r.remaining,1,'COMMA')}円|">
</span>
</div>
</div>
<p class="empty" th:if="${#lists.isEmpty(rows)}">表示できるカテゴリーがありません。</p>
</div>
</section>
<section class="panel">
<h2>カテゴリー別比較（年間）</h2>
<div class="legend">
<span class="budget">予算＋収入</span>
<span class="actual">支出</span>
</div>
<div class="annual-cards">
<article class="annual-card" th:each="card:${annualCards}" th:classappend="${card.totalCard}?' total-card':''">
<div class="annual-card__header"><h3 th:text="${card.name}">カテゴリー</h3><div class="annual-card__totals"><span th:text="|予算＋収入 ${#numbers.formatInteger(card.available,1,'COMMA')}円|"></span><span th:text="|支出 ${#numbers.formatInteger(card.expense,1,'COMMA')}円|"></span><span th:text="|使用率 ${card.rate}%|"></span><span th:text="|残金 ${#numbers.formatInteger(card.remaining,1,'COMMA')}円|"></span></div></div>
<div class="annual-chart-scroll"><div class="annual-chart">
<div class="annual-month" th:each="month:${card.months}">
<div class="annual-bars">
<div class="annual-vbar budget" th:style="|height:${month.available_width}%|" th:title="|予算＋収入 ${#numbers.formatInteger(month.available,1,'COMMA')}円|"><span th:text="|${#numbers.formatInteger(month.available,1,'COMMA')}円|">0円</span></div>
<div class="annual-vbar actual" th:style="|height:${month.expense_width}%|" th:title="|支出 ${#numbers.formatInteger(month.expense,1,'COMMA')}円|"><span th:text="|${#numbers.formatInteger(month.expense,1,'COMMA')}円|">0円</span></div>
</div><span class="annual-month-label" th:text="|${month.month}月|">1月</span>
</div>
</div></div>
</article>
</div>
</section>
<section class="panel">
<h2>累計比較</h2>
<div class="legend">
<span class="budget">累計予算</span>
<span class="actual">累計支出</span>
</div>
<div class="chart-scroll">
<div class="vertical-chart">
<div class="chart-group" th:each="r:${cumulative}">
<div class="vbar budget" th:style="|height:${r.budget_height}%|" th:title="|累計予算 ${r.cum_budget}円|">
<span class="vbar-value" th:text="|${#numbers.formatInteger(r.cum_budget,1,'COMMA')}円|">0円</span>
</div>
<div class="vbar actual" th:style="|height:${r.expense_height}%|" th:title="|累計支出 ${r.cum_expense}円|">
<span class="vbar-value" th:text="|${#numbers.formatInteger(r.cum_expense,1,'COMMA')}円|">0円</span>
</div>
<span class="chart-label" th:text="|${r.month}月|">
</span>
</div>
</div>
</div>
</section>
</div>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body>
</html>
