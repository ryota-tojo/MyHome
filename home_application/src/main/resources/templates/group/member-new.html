<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユーザー新規登録</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-row"><h1>ユーザー新規登録</h1><a th:href="@{/group/members}">メンバー管理へ戻る</a></div><div class="alert" th:if="${error}" th:text="${error}"></div><section class="panel"><form class="registration-form" th:action="@{/group/members/new}" method="post"><label>ユーザーID <span class="required">必須</span><input name="userId" required minlength="4" maxlength="64" pattern="[A-Za-z0-9_-]+"></label><label>ユーザー表示名 <span class="required">必須</span><input name="userName" required maxlength="100"></label><label>パスワード <span class="required">必須</span><input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><label>パスワード（確認） <span class="required">必須</span><input type="password" name="confirmation" required minlength="8" maxlength="72" autocomplete="new-password"></label><fieldset><legend>グループ権限</legend><div class="radio-group"><label class="choice-row"><input type="radio" name="leader" value="0" checked>メンバー</label><label class="choice-row"><input type="radio" name="leader" value="1">リーダー</label></div></fieldset><div class="registration-form__actions"><button>登録</button></div></form></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
