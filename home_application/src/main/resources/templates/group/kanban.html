<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>カンバン</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}">
  <style>
    :root{--lane-color:#f8f6f1;--kanban-sticky-top:64px}
    .kanban-page main{width:100%;max-width:none;padding-right:8px;padding-left:8px}.kanban-wrap{width:100%;max-width:none;margin:auto}.kanban-toolbar{display:flex;justify-content:flex-end;margin-bottom:12px}.kanban-board-shell{width:100%;max-width:100%;padding:14px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-inline:contain;scrollbar-gutter:stable;background:rgba(255,255,255,.72);border:1px solid #d9dfe5;border-radius:16px;box-shadow:0 4px 16px rgba(20,28,40,.09)}.kanban-board{--lane-count:1;display:grid;grid-template-columns:repeat(var(--lane-count),minmax(300px,1fr));gap:16px;align-items:start;min-width:100%}.kanban-column{background:var(--lane-color,#f8f6f1);border:1px solid #d9dfe5;border-radius:14px;min-height:380px;padding:14px}.column-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font-size:1.05rem}.card-count{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;background:rgba(233,237,241,.88);font-size:.8rem}.card-list{display:grid;gap:12px;min-height:300px}.kanban-card{position:relative;border:1px solid #d4d8dc;border-radius:10px;padding:13px 13px 11px;box-shadow:0 3px 9px rgba(0,0,0,.08);cursor:pointer;overflow-wrap:anywhere}.kanban-card[data-color=YELLOW]{background:#fff6c7}.kanban-card[data-color=BLUE]{background:#dceeff}.kanban-card[data-color=GREEN]{background:#dcf4e5}.kanban-card[data-color=PINK]{background:#ffe1e8}.kanban-card[data-color=WHITE]{background:#fff}.kanban-card h3{margin:0 34px 8px 0;font-size:1rem}.kanban-card p{white-space:pre-wrap;margin:0 0 12px;line-height:1.55}.card-meta{color:#66717c;font-size:.75rem}.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.card-actions button{min-height:34px;padding:.35rem .7rem}.card-handle{position:absolute;right:11px;top:10px;color:#6d757d;cursor:grab;touch-action:none;user-select:none}.kanban-card.dragging,.kanban-card.touch-moving{opacity:.75;box-shadow:0 10px 24px rgba(13,110,253,.25)}.card-list.drag-over{outline:2px dashed #0d6efd;outline-offset:5px;border-radius:8px}.kanban-dialog textarea{min-height:150px;resize:vertical}.color-options{display:flex;gap:10px;flex-wrap:wrap}.color-options label{display:flex;flex-direction:row;align-items:center;gap:5px}.empty-note{color:#7a8289;text-align:center;padding:30px 8px}.add-button{border-radius:12px}
    .kanban-dialog .confirm-dialog__body{display:grid;gap:18px}.kanban-dialog .confirm-dialog__body>label{display:grid!important;grid-template-columns:minmax(0,1fr)!important;align-items:stretch!important;gap:7px;width:100%!important;margin:0!important}.kanban-dialog .confirm-dialog__body>label>input,.kanban-dialog .confirm-dialog__body>label>select,.kanban-dialog .confirm-dialog__body>label>textarea{display:block;width:100%!important;min-width:0;margin:0!important}.kanban-dialog textarea{min-height:150px}.kanban-dialog fieldset{width:100%;min-width:0;margin:0;padding:14px 18px}.kanban-dialog .color-options label{display:inline-flex!important;flex-direction:row!important;align-items:center!important;gap:7px;width:auto!important;margin:0!important}.kanban-dialog .color-options input{width:auto!important;margin:0!important}
    .kanban-detail-dialog{width:min(820px,calc(100vw - 32px));max-width:820px;max-height:min(88vh,820px);padding:0;overflow:hidden}.kanban-detail-dialog [hidden]{display:none!important}.kanban-detail-dialog .confirm-dialog__body{display:block;max-height:calc(min(88vh,820px) - 86px);overflow-y:auto;padding:28px 30px 22px}.kanban-detail-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.kanban-detail-heading h2{margin:0;font-size:clamp(1.3rem,3vw,2rem);overflow-wrap:anywhere}.kanban-detail-close{min-width:42px;width:42px;height:42px;padding:0;border-radius:50%;font-size:1.35rem;line-height:1}.kanban-detail-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;color:#66717c}.kanban-detail-form{display:grid;gap:18px}.kanban-detail-form>label{display:grid;gap:7px}.kanban-detail-form input,.kanban-detail-form select,.kanban-detail-form textarea{width:100%;margin:0}.kanban-detail-form textarea{min-height:220px;resize:vertical;line-height:1.7}.kanban-detail-form fieldset{margin:0;padding:14px 18px}.kanban-detail-form .color-options input{width:auto}.kanban-detail-form :disabled{cursor:default;opacity:1;color:#263746;background:#f7f9fa;border-color:#d9dfe5}.kanban-detail-dialog:not(.is-editing) .color-options label:has(input:not(:checked)){display:none!important}.kanban-detail-dialog:not(.is-editing) .color-options input{pointer-events:none}.kanban-detail-dialog .confirm-dialog__actions{display:flex;gap:10px;flex-wrap:wrap}.kanban-detail-dialog .detail-delete{margin-right:auto}.kanban-card:focus-visible{outline:3px solid #74b9e8;outline-offset:3px}
    .kanban-board{align-items:stretch}.kanban-column{display:flex;flex-direction:column;height:100%;min-height:0}.card-list{flex:1;align-content:start;min-height:72px}.column-title{position:sticky;left:0;z-index:50;isolation:isolate;margin:-14px -14px 12px;padding:14px;background:var(--lane-color,#f8f6f1);border-bottom:1px solid rgba(80,90,100,.18);border-radius:13px 13px 0 0;box-shadow:0 3px 7px rgba(20,28,40,.08)}.kanban-card{z-index:1}.card-order-actions{display:flex;gap:5px;margin-right:auto}.card-order-actions button{display:inline-flex;align-items:center;justify-content:center;width:34px;min-width:34px;height:34px;min-height:34px;padding:0;background:#fff;color:#46515b;border-color:#cfd6dc}.card-order-actions button:hover{background:#e5f3fb;color:#263746}.card-order-actions button:disabled{background:#edf0f2;color:#a6adb3}
    @media(max-width:850px){.kanban-board-shell{padding:10px}.kanban-board{grid-template-columns:repeat(var(--lane-count),minmax(calc(100vw - 54px),calc(100vw - 54px)));width:max-content;max-width:none}.kanban-column{min-width:0;min-height:0;height:100%}.card-list{min-height:72px}.kanban-card{cursor:pointer}.kanban-detail-dialog .confirm-dialog__body{padding:22px 20px 18px}.kanban-detail-content{min-height:220px;padding:16px}}
  </style>
</head>
<body class="kanban-page">
<header th:replace="~{fragments :: header}"></header>
<main>
  <div class="title-area"><h1>カンバン</h1></div>
  <div class="kanban-wrap">
    <div class="success" th:if="${param.created}">カードを登録しました。</div><div class="success" th:if="${param.updated}">カードを更新しました。</div><div class="success" th:if="${param.deleted}">カードを削除しました。</div><div class="alert" th:if="${param.error}">入力内容を確認してください。</div>
    <div class="kanban-toolbar"><button type="button" class="add-button" id="create-open" aria-label="カードを追加">＋</button></div>
    <div class="kanban-board-shell" data-horizontal-scroll><div class="kanban-board" th:style="|--lane-count:${#lists.size(lanes)}|">
      <section class="kanban-column" th:each="lane:${lanes}" th:style="|--lane-color:${lane.color}|">
        <h2 class="column-title"><span th:text="${lane.name}"></span><span class="card-count" th:text="${cardCounts.get(lane.id)}"></span></h2>
        <div class="card-list" th:attr="data-status=${lane.id}">
          <article class="kanban-card" th:each="card:${cards}" th:if="${card.status==lane.id}" th:attr="data-id=${card.id},data-color=${card.color},data-title=${card.title},data-content=${card.content},data-status=${card.status},data-lane=${lane.name},data-updated=${#dates.format(card.update_date,'yyyy/MM/dd HH:mm:ss')}" draggable="true" tabindex="0" role="button" aria-label="カードの詳細を表示">
            <span class="card-handle" aria-label="長押しして移動">☰</span><h3 th:text="${card.title}"></h3><p th:if="${!#strings.isEmpty(card.content)}" th:text="${card.content}"></p><div class="card-meta" th:text="${#dates.format(card.update_date,'yyyy/MM/dd HH:mm:ss')}"></div>
            <div class="card-actions"><div class="card-order-actions"><button type="button" class="move-up" aria-label="上へ移動" title="上へ移動">↑</button><button type="button" class="move-down" aria-label="下へ移動" title="下へ移動">↓</button></div></div>
          </article>
          <p class="empty-note">カードをここへ移動できます</p>
        </div>
      </section>
    </div></div>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<dialog id="card-dialog" class="confirm-dialog kanban-dialog" data-create-action="/group/kanban">
  <form id="card-form" method="post" th:action="@{/group/kanban}">
    <div class="confirm-dialog__body"><h2 id="dialog-title">カードを登録</h2><label><span class="label-title">タイトル <span class="required">必須</span></span><input name="title" id="card-title" maxlength="100" required></label><label><span class="label-title">メモ</span><textarea name="content" id="card-content" maxlength="2000"></textarea></label><label><span class="label-title">レーン <span class="required">必須</span></span><select name="status" id="card-status" required><option th:each="lane:${lanes}" th:value="${lane.id}" th:text="${lane.name}"></option></select></label><fieldset><legend>カード色</legend><div class="color-options"><label><input type="radio" name="color" value="YELLOW" checked>黄</label><label><input type="radio" name="color" value="BLUE">青</label><label><input type="radio" name="color" value="GREEN">緑</label><label><input type="radio" name="color" value="PINK">桃</label><label><input type="radio" name="color" value="WHITE">白</label></div></fieldset></div>
    <div class="confirm-dialog__actions"><button type="button" class="secondary" id="dialog-cancel">キャンセル</button><button type="submit" id="submit-label">登録</button></div>
  </form>
</dialog>
<dialog id="card-detail-dialog" class="confirm-dialog kanban-detail-dialog" aria-labelledby="card-detail-title">
  <div class="confirm-dialog__body">
    <div class="kanban-detail-heading"><h2 id="card-detail-title">カード詳細</h2><button type="button" class="secondary kanban-detail-close" id="card-detail-close" aria-label="詳細を閉じる">×</button></div>
    <div class="kanban-detail-meta"><span id="card-detail-updated"></span></div>
    <form id="card-detail-edit-form" class="kanban-detail-form" method="post" th:action="@{/group/kanban}">
      <label><span class="label-title">タイトル <span class="required">必須</span></span><input name="title" id="card-detail-title-input" maxlength="100" required disabled></label>
      <label><span class="label-title">メモ</span><textarea name="content" id="card-detail-content" maxlength="2000" disabled></textarea></label>
      <label><span class="label-title">レーン <span class="required">必須</span></span><select name="status" id="card-detail-status" required disabled><option th:each="lane:${lanes}" th:value="${lane.id}" th:text="${lane.name}"></option></select></label>
      <fieldset><legend>カード色</legend><div class="color-options"><label><input type="radio" name="color" value="YELLOW" disabled>黄</label><label><input type="radio" name="color" value="BLUE" disabled>青</label><label><input type="radio" name="color" value="GREEN" disabled>緑</label><label><input type="radio" name="color" value="PINK" disabled>桃</label><label><input type="radio" name="color" value="WHITE" disabled>白</label></div></fieldset>
    </form>
  </div>
  <form id="card-detail-delete-form" method="post" th:action="@{/group/kanban}" onsubmit="return confirm('このカードを削除しますか？')"></form>
  <div class="confirm-dialog__actions"><button type="submit" form="card-detail-delete-form" class="danger detail-delete" id="card-detail-delete">削除</button><button type="button" class="secondary" id="card-detail-close-bottom">閉じる</button><button type="button" class="secondary" id="card-detail-edit">編集</button><button type="button" class="secondary" id="card-detail-cancel-edit" hidden>編集をやめる</button><button type="submit" form="card-detail-edit-form" id="card-detail-save" hidden>更新</button></div>
</dialog>
<script>
(()=>{const board=document.querySelector('.kanban-board'),dialog=document.getElementById('card-dialog'),detailDialog=document.getElementById('card-detail-dialog'),form=document.getElementById('card-form'),title=document.getElementById('card-title'),content=document.getElementById('card-content'),status=document.getElementById('card-status'),createOpen=document.getElementById('create-open');let dragged=null,dragSourceList=null,timer=null,touchCard=null,touchSourceList=null,dragOccurred=false;
const syncStickyTop=()=>{const header=document.querySelector('body>header,.site-header');const height=header?Math.ceil(header.getBoundingClientRect().height):0;document.documentElement.style.setProperty('--kanban-sticky-top',height+'px')};syncStickyTop();window.addEventListener('resize',syncStickyTop);window.addEventListener('load',syncStickyTop);
const csrf=()=>document.querySelector('#card-form input[name="_csrf"]');const refreshBoard=()=>document.querySelectorAll('.card-list').forEach(l=>{const cards=[...l.querySelectorAll('.kanban-card')];l.querySelector('.empty-note').hidden=cards.length>0;const count=l.closest('.kanban-column')?.querySelector('.card-count');if(count)count.textContent=String(cards.length);cards.forEach((card,index)=>{const up=card.querySelector('.move-up'),down=card.querySelector('.move-down');if(up)up.disabled=index===0;if(down)down.disabled=index===cards.length-1})});
async function save(list){const body=new URLSearchParams({status:list.dataset.status});list.querySelectorAll('.kanban-card').forEach(c=>body.append('ids',c.dataset.id));const c=csrf();if(c)body.append(c.name,c.value);const response=await fetch('/group/kanban/order',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!response.ok)throw new Error('並び順を保存できませんでした');refreshBoard()}
let saveQueue=Promise.resolve();function saveChangedLists(source,destination){const lists=[...new Set([source,destination].filter(Boolean))];saveQueue=saveQueue.then(async()=>{for(const list of lists)await save(list)}).catch(()=>location.reload())}
function place(list,card,y){const next=[...list.querySelectorAll('.kanban-card:not(.dragging):not(.touch-moving)')].find(x=>y<x.getBoundingClientRect().top+x.offsetHeight/2);list.insertBefore(card,next||list.querySelector('.empty-note'))}
const detailForm=document.getElementById('card-detail-edit-form'),detailDeleteForm=document.getElementById('card-detail-delete-form'),detailTitle=document.getElementById('card-detail-title-input'),detailContent=document.getElementById('card-detail-content'),detailStatus=document.getElementById('card-detail-status'),detailEdit=document.getElementById('card-detail-edit'),detailCancel=document.getElementById('card-detail-cancel-edit'),detailSave=document.getElementById('card-detail-save');let detailCard=null;
const setDetailEditing=editing=>{detailDialog.classList.toggle('is-editing',editing);[detailTitle,detailContent,detailStatus,...detailForm.querySelectorAll('[name="color"]')].forEach(field=>field.disabled=!editing);detailEdit.hidden=editing;detailCancel.hidden=!editing;detailSave.hidden=!editing;if(editing)detailTitle.focus()};
const populateDetail=card=>{detailCard=card;detailForm.reset();document.getElementById('card-detail-title').textContent=card.dataset.title||'カード詳細';document.getElementById('card-detail-updated').textContent=card.dataset.updated?'更新日時：'+card.dataset.updated:'';detailTitle.value=card.dataset.title||'';detailContent.value=card.dataset.content||'';detailStatus.value=card.dataset.status||'';const color=detailForm.querySelector(`[name="color"][value="${card.dataset.color}"]`);if(color)color.checked=true;detailForm.action='/group/kanban/'+encodeURIComponent(card.dataset.id)+'/update';detailDeleteForm.action='/group/kanban/'+encodeURIComponent(card.dataset.id)+'/delete';setDetailEditing(false)};
const openDetail=card=>{populateDetail(card);detailDialog.showModal();document.getElementById('card-detail-close').focus()};
board.addEventListener('click',e=>{const button=e.target.closest('.move-up,.move-down');if(button){const card=button.closest('.kanban-card'),list=card.closest('.card-list'),cards=[...list.querySelectorAll('.kanban-card')],index=cards.indexOf(card);if(button.classList.contains('move-up')&&index>0)list.insertBefore(card,cards[index-1]);if(button.classList.contains('move-down')&&index>=0&&index<cards.length-1)list.insertBefore(cards[index+1],card);saveChangedLists(list,list);return}if(dragOccurred){dragOccurred=false;return}if(e.target.closest('button,form,.card-handle'))return;const card=e.target.closest('.kanban-card');if(card)openDetail(card)});board.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('kanban-card')){e.preventDefault();openDetail(e.target)}});
const dropListAt=element=>element?.closest('.card-list')||element?.closest('.kanban-column')?.querySelector('.card-list');
board.addEventListener('dragstart',e=>{dragged=e.target.closest('.kanban-card');dragSourceList=dragged?.closest('.card-list')||null;dragOccurred=!!dragged;dragged?.classList.add('dragging')});board.addEventListener('dragover',e=>{e.preventDefault();const list=dropListAt(e.target);if(list&&dragged){document.querySelectorAll('.card-list').forEach(x=>x.classList.toggle('drag-over',x===list));place(list,dragged,e.clientY)}});board.addEventListener('dragend',()=>{if(!dragged)return;const destination=dragged.closest('.card-list');dragged.classList.remove('dragging');document.querySelectorAll('.card-list').forEach(x=>x.classList.remove('drag-over'));saveChangedLists(dragSourceList,destination);dragged=null;dragSourceList=null;setTimeout(()=>dragOccurred=false,0)});
board.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||!e.target.closest('.card-handle'))return;const card=e.target.closest('.kanban-card');timer=setTimeout(()=>{touchCard=card;touchSourceList=card.closest('.card-list');dragOccurred=true;card.classList.add('touch-moving');card.setPointerCapture?.(e.pointerId)},500)});board.addEventListener('pointermove',e=>{if(!touchCard)return;e.preventDefault();const list=dropListAt(document.elementFromPoint(e.clientX,e.clientY));if(list){place(list,touchCard,e.clientY);document.querySelectorAll('.card-list').forEach(x=>x.classList.toggle('drag-over',x===list))}},{passive:false});const finish=()=>{clearTimeout(timer);timer=null;if(touchCard){const destination=touchCard.closest('.card-list');touchCard.classList.remove('touch-moving');document.querySelectorAll('.card-list').forEach(x=>x.classList.remove('drag-over'));saveChangedLists(touchSourceList,destination);touchCard=null;touchSourceList=null;setTimeout(()=>dragOccurred=false,0)}};board.addEventListener('pointerup',finish);board.addEventListener('pointercancel',finish);
createOpen.onclick=()=>{form.reset();form.action=dialog.dataset.createAction;document.getElementById('dialog-title').textContent='カードを登録';document.getElementById('submit-label').textContent='登録';dialog.showModal();title.focus()};document.getElementById('dialog-cancel').onclick=()=>dialog.close();const closeDetail=()=>{setDetailEditing(false);detailDialog.close()};document.getElementById('card-detail-close').onclick=closeDetail;document.getElementById('card-detail-close-bottom').onclick=closeDetail;detailEdit.onclick=()=>setDetailEditing(true);detailCancel.onclick=()=>{if(detailCard)populateDetail(detailCard)};detailDialog.addEventListener('click',e=>{const rect=detailDialog.getBoundingClientRect();if(!detailDialog.classList.contains('is-editing')&&(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom))closeDetail()});refreshBoard();})();
</script>
</body></html>
