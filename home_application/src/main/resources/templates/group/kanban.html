<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>カンバン</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}">
  <style>
    :root{--lane-color:#f8f6f1;--kanban-sticky-top:64px}
    .kanban-wrap{width:min(1500px,94vw);margin:auto}.kanban-toolbar{display:flex;justify-content:flex-end;margin-bottom:16px}.kanban-board{--lane-count:1;display:grid;grid-template-columns:repeat(var(--lane-count),minmax(260px,1fr));gap:16px;align-items:start}.kanban-column{background:var(--lane-color,#f8f6f1);border:1px solid #d9dfe5;border-radius:14px;min-height:380px;padding:14px}.column-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font-size:1.05rem}.card-count{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;background:rgba(233,237,241,.88);font-size:.8rem}.card-list{display:grid;gap:12px;min-height:300px}.kanban-card{position:relative;border:1px solid #d4d8dc;border-radius:10px;padding:13px 13px 11px;box-shadow:0 3px 9px rgba(0,0,0,.08);cursor:pointer;overflow-wrap:anywhere}.kanban-card[data-color=YELLOW]{background:#fff6c7}.kanban-card[data-color=BLUE]{background:#dceeff}.kanban-card[data-color=GREEN]{background:#dcf4e5}.kanban-card[data-color=PINK]{background:#ffe1e8}.kanban-card[data-color=WHITE]{background:#fff}.kanban-card h3{margin:0 34px 8px 0;font-size:1rem}.kanban-card p{white-space:pre-wrap;margin:0 0 12px;line-height:1.55}.card-meta{color:#66717c;font-size:.75rem}.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.card-actions button{min-height:34px;padding:.35rem .7rem}.card-handle{position:absolute;right:11px;top:10px;color:#6d757d;cursor:grab;touch-action:none;user-select:none}.kanban-card.dragging,.kanban-card.touch-moving{opacity:.75;box-shadow:0 10px 24px rgba(13,110,253,.25)}.card-list.drag-over{outline:2px dashed #0d6efd;outline-offset:5px;border-radius:8px}.kanban-dialog textarea{min-height:150px;resize:vertical}.color-options{display:flex;gap:10px;flex-wrap:wrap}.color-options label{display:flex;flex-direction:row;align-items:center;gap:5px}.empty-note{color:#7a8289;text-align:center;padding:30px 8px}.add-button{border-radius:12px}
    .kanban-dialog .confirm-dialog__body{display:grid;gap:18px}.kanban-dialog .confirm-dialog__body>label{display:grid!important;grid-template-columns:minmax(0,1fr)!important;align-items:stretch!important;gap:7px;width:100%!important;margin:0!important}.kanban-dialog .confirm-dialog__body>label>input,.kanban-dialog .confirm-dialog__body>label>select,.kanban-dialog .confirm-dialog__body>label>textarea{display:block;width:100%!important;min-width:0;margin:0!important}.kanban-dialog textarea{min-height:150px}.kanban-dialog fieldset{width:100%;min-width:0;margin:0;padding:14px 18px}.kanban-dialog .color-options label{display:inline-flex!important;flex-direction:row!important;align-items:center!important;gap:7px;width:auto!important;margin:0!important}.kanban-dialog .color-options input{width:auto!important;margin:0!important}
    .kanban-detail-dialog{width:min(820px,calc(100vw - 32px));max-width:820px;max-height:min(84vh,760px);padding:0;overflow:hidden}.kanban-detail-dialog form{display:flex;flex-direction:column;max-height:min(84vh,760px)}.kanban-detail-dialog .confirm-dialog__body{display:block;overflow-y:auto;padding:28px 30px 22px}.kanban-detail-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.kanban-detail-heading h2{margin:0;font-size:clamp(1.3rem,3vw,2rem);overflow-wrap:anywhere}.kanban-detail-close{min-width:42px;width:42px;height:42px;padding:0;border-radius:50%;font-size:1.35rem;line-height:1}.kanban-detail-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;color:#66717c}.kanban-detail-lane{display:inline-flex;align-items:center;min-height:30px;padding:4px 12px;border-radius:999px;background:#eef2f5;color:#34404a;font-weight:700}.kanban-detail-content{min-height:180px;margin:0;padding:20px;border:1px solid #d9dfe5;border-radius:12px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:1.05rem}.kanban-detail-content.is-empty{color:#7a8289}.kanban-card:focus-visible{outline:3px solid #74b9e8;outline-offset:3px}
    .kanban-board{align-items:stretch}.kanban-column{height:100%;min-height:0}.card-list{min-height:72px}.column-title{position:sticky;top:var(--kanban-sticky-top,64px);z-index:50;isolation:isolate;margin:-14px -14px 12px;padding:14px;background:var(--lane-color,#f8f6f1);border-bottom:1px solid rgba(80,90,100,.18);border-radius:13px 13px 0 0;box-shadow:0 3px 7px rgba(20,28,40,.08)}.kanban-card{z-index:1}.card-order-actions{display:flex;gap:5px;margin-right:auto}.card-order-actions button{display:inline-flex;align-items:center;justify-content:center;width:34px;min-width:34px;height:34px;min-height:34px;padding:0;background:#fff;color:#46515b;border-color:#cfd6dc}.card-order-actions button:hover{background:#e5f3fb;color:#263746}.card-order-actions button:disabled{background:#edf0f2;color:#a6adb3}.add-button.kanban-floating-add{position:absolute;right:auto;margin:0;z-index:1300;transition:opacity .2s ease,transform .2s ease}.header-menu-open .kanban-floating-add{opacity:0;transform:translateY(-6px);pointer-events:none}
    @media(max-width:850px){.kanban-wrap{width:94vw;overflow:visible}.kanban-board{grid-template-columns:repeat(var(--lane-count),calc(94vw - 8px));width:max-content;max-width:none;overflow:visible;padding:2px 2px 14px}.kanban-column{min-width:0;min-height:0;height:100%}.card-list{min-height:72px}.kanban-card{cursor:pointer}.kanban-detail-dialog .confirm-dialog__body{padding:22px 20px 18px}.kanban-detail-content{min-height:220px;padding:16px}}
  </style>
</head>
<body class="kanban-page">
<header th:replace="~{fragments :: header}"></header>
<main>
  <div class="title-area"><h1>カンバン</h1></div>
  <div class="kanban-wrap">
    <div class="success" th:if="${param.created}">カードを登録しました。</div><div class="success" th:if="${param.updated}">カードを更新しました。</div><div class="success" th:if="${param.deleted}">カードを削除しました。</div><div class="alert" th:if="${param.error}">入力内容を確認してください。</div>
    <div class="kanban-toolbar"><button type="button" class="add-button" id="create-open" aria-label="カードを追加">＋</button></div>
    <div class="kanban-board" th:style="|--lane-count:${#lists.size(lanes)}|">
      <section class="kanban-column" th:each="lane:${lanes}" th:style="|--lane-color:${lane.color}|">
        <h2 class="column-title"><span th:text="${lane.name}"></span><span class="card-count" th:text="${cardCounts.get(lane.id)}"></span></h2>
        <div class="card-list" th:attr="data-status=${lane.id}">
          <article class="kanban-card" th:each="card:${cards}" th:if="${card.status==lane.id}" th:attr="data-id=${card.id},data-color=${card.color},data-title=${card.title},data-content=${card.content},data-lane=${lane.name},data-updated=${#dates.format(card.update_date,'yyyy/MM/dd HH:mm:ss')}" draggable="true" tabindex="0" role="button" aria-label="カードの詳細を表示">
            <span class="card-handle" aria-label="長押しして移動">☰</span><h3 th:text="${card.title}"></h3><p th:if="${!#strings.isEmpty(card.content)}" th:text="${card.content}"></p><div class="card-meta" th:text="${#dates.format(card.update_date,'yyyy/MM/dd HH:mm:ss')}"></div>
            <div class="card-actions"><div class="card-order-actions"><button type="button" class="move-up" aria-label="上へ移動" title="上へ移動">↑</button><button type="button" class="move-down" aria-label="下へ移動" title="下へ移動">↓</button></div><button type="button" class="secondary edit-button" th:attr="data-id=${card.id},data-title=${card.title},data-content=${card.content},data-status=${card.status},data-color=${card.color}">編集</button><form method="post" th:action="@{|/group/kanban/${card.id}/delete|}" onsubmit="return confirm('このカードを削除しますか？')"><button type="submit" class="danger">削除</button></form></div>
          </article>
          <p class="empty-note">カードをここへ移動できます</p>
        </div>
      </section>
    </div>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<dialog id="card-dialog" class="confirm-dialog kanban-dialog" data-create-action="/group/kanban">
  <form id="card-form" method="post" th:action="@{/group/kanban}">
    <div class="confirm-dialog__body"><h2 id="dialog-title">カードを登録</h2><label><span class="label-title">タイトル <span class="required">必須</span></span><input name="title" id="card-title" maxlength="100" required></label><label><span class="label-title">メモ</span><textarea name="content" id="card-content" maxlength="2000"></textarea></label><label><span class="label-title">レーン <span class="required">必須</span></span><select name="status" id="card-status" required><option th:each="lane:${lanes}" th:value="${lane.id}" th:text="${lane.name}"></option></select></label><fieldset><legend>カード色</legend><div class="color-options"><label><input type="radio" name="color" value="YELLOW" checked>黄</label><label><input type="radio" name="color" value="BLUE">青</label><label><input type="radio" name="color" value="GREEN">緑</label><label><input type="radio" name="color" value="PINK">桃</label><label><input type="radio" name="color" value="WHITE">白</label></div></fieldset></div>
    <div class="confirm-dialog__actions"><button type="button" class="secondary" id="dialog-cancel">キャンセル</button><button type="submit" id="submit-label">登録</button></div>
  </form>
</dialog>
<dialog id="card-detail-dialog" class="confirm-dialog kanban-detail-dialog" aria-labelledby="card-detail-title">
  <form method="dialog">
    <div class="confirm-dialog__body">
      <div class="kanban-detail-heading"><h2 id="card-detail-title"></h2><button type="button" class="secondary kanban-detail-close" id="card-detail-close" aria-label="詳細を閉じる">×</button></div>
      <div class="kanban-detail-meta"><span class="kanban-detail-lane" id="card-detail-lane"></span><span id="card-detail-updated"></span></div>
      <p class="kanban-detail-content" id="card-detail-content"></p>
    </div>
    <div class="confirm-dialog__actions"><button type="submit" class="secondary">閉じる</button></div>
  </form>
</dialog>
<script>
(()=>{const board=document.querySelector('.kanban-board'),dialog=document.getElementById('card-dialog'),detailDialog=document.getElementById('card-detail-dialog'),form=document.getElementById('card-form'),title=document.getElementById('card-title'),content=document.getElementById('card-content'),status=document.getElementById('card-status'),createOpen=document.getElementById('create-open');let dragged=null,timer=null,touchCard=null,dragOccurred=false;
const createOpenPosition=document.createComment('kanban-create-position');createOpen.parentNode.insertBefore(createOpenPosition,createOpen);const isMobileViewport=()=>((window.visualViewport?.width)||document.documentElement.clientWidth)<=900;const positionCreateOpen=()=>{if(!isMobileViewport()||createOpen.parentNode!==document.body)return;const viewport=window.visualViewport,pageLeft=window.scrollX+(viewport?.offsetLeft||0),pageTop=window.scrollY+(viewport?.offsetTop||0),width=viewport?.width||document.documentElement.clientWidth,laneTop=board.getBoundingClientRect().top+window.scrollY-createOpen.offsetHeight-12,stickyTop=pageTop+76;createOpen.style.left=Math.max(0,pageLeft+width-createOpen.offsetWidth-14)+'px';createOpen.style.top=Math.max(laneTop,stickyTop)+'px'};const syncCreateOpen=()=>{if(isMobileViewport()){createOpen.classList.add('kanban-floating-add');if(createOpen.parentNode!==document.body)document.body.appendChild(createOpen);positionCreateOpen()}else{createOpen.classList.remove('kanban-floating-add');createOpen.style.removeProperty('left');createOpen.style.removeProperty('top');if(createOpen.parentNode!==createOpenPosition.parentNode)createOpenPosition.parentNode.insertBefore(createOpen,createOpenPosition.nextSibling)}};syncCreateOpen();window.addEventListener('scroll',positionCreateOpen,{passive:true});window.addEventListener('resize',()=>{syncCreateOpen();positionCreateOpen()});window.visualViewport?.addEventListener('scroll',positionCreateOpen,{passive:true});window.visualViewport?.addEventListener('resize',()=>{syncCreateOpen();positionCreateOpen()},{passive:true});
const syncStickyTop=()=>{const header=document.querySelector('body>header,.site-header');const height=header?Math.ceil(header.getBoundingClientRect().height):0;document.documentElement.style.setProperty('--kanban-sticky-top',height+'px')};syncStickyTop();window.addEventListener('resize',syncStickyTop);window.addEventListener('load',syncStickyTop);
const csrf=()=>document.querySelector('#card-form input[name="_csrf"]');const refreshBoard=()=>document.querySelectorAll('.card-list').forEach(l=>{const cards=[...l.querySelectorAll('.kanban-card')];l.querySelector('.empty-note').hidden=cards.length>0;const count=l.closest('.kanban-column')?.querySelector('.card-count');if(count)count.textContent=String(cards.length);cards.forEach((card,index)=>{const up=card.querySelector('.move-up'),down=card.querySelector('.move-down');if(up)up.disabled=index===0;if(down)down.disabled=index===cards.length-1})});
function save(list){const body=new URLSearchParams({status:list.dataset.status});list.querySelectorAll('.kanban-card').forEach(c=>body.append('ids',c.dataset.id));const c=csrf();if(c)body.append(c.name,c.value);fetch('/group/kanban/order',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}).then(r=>{if(!r.ok)location.reload()});refreshBoard()}
function place(list,card,y){const next=[...list.querySelectorAll('.kanban-card:not(.dragging):not(.touch-moving)')].find(x=>y<x.getBoundingClientRect().top+x.offsetHeight/2);list.insertBefore(card,next||list.querySelector('.empty-note'))}
const openDetail=card=>{document.getElementById('card-detail-title').textContent=card.dataset.title||'';document.getElementById('card-detail-lane').textContent=card.dataset.lane||'';document.getElementById('card-detail-updated').textContent=card.dataset.updated?'更新日時：'+card.dataset.updated:'';const detailContent=document.getElementById('card-detail-content'),text=card.dataset.content||'';detailContent.textContent=text||'メモはありません。';detailContent.classList.toggle('is-empty',!text);detailDialog.showModal();document.getElementById('card-detail-close').focus()};
board.addEventListener('click',e=>{const button=e.target.closest('.move-up,.move-down');if(button){const card=button.closest('.kanban-card'),list=card.closest('.card-list'),cards=[...list.querySelectorAll('.kanban-card')],index=cards.indexOf(card);if(button.classList.contains('move-up')&&index>0)list.insertBefore(card,cards[index-1]);if(button.classList.contains('move-down')&&index>=0&&index<cards.length-1)list.insertBefore(cards[index+1],card);save(list);return}if(dragOccurred){dragOccurred=false;return}if(e.target.closest('button,form,.card-handle'))return;const card=e.target.closest('.kanban-card');if(card)openDetail(card)});board.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('kanban-card')){e.preventDefault();openDetail(e.target)}});
board.addEventListener('dragstart',e=>{dragged=e.target.closest('.kanban-card');dragOccurred=!!dragged;dragged?.classList.add('dragging')});board.addEventListener('dragover',e=>{e.preventDefault();const list=e.target.closest('.card-list');if(list&&dragged){document.querySelectorAll('.card-list').forEach(x=>x.classList.toggle('drag-over',x===list));place(list,dragged,e.clientY)}});board.addEventListener('dragend',()=>{if(!dragged)return;const lists=[...document.querySelectorAll('.card-list')];dragged.classList.remove('dragging');lists.forEach(x=>x.classList.remove('drag-over'));lists.forEach(save);dragged=null;setTimeout(()=>dragOccurred=false,0)});
board.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||!e.target.closest('.card-handle'))return;const card=e.target.closest('.kanban-card');timer=setTimeout(()=>{touchCard=card;dragOccurred=true;card.classList.add('touch-moving');card.setPointerCapture?.(e.pointerId)},500)});board.addEventListener('pointermove',e=>{if(!touchCard)return;e.preventDefault();const el=document.elementFromPoint(e.clientX,e.clientY),list=el?.closest('.card-list');if(list){place(list,touchCard,e.clientY);document.querySelectorAll('.card-list').forEach(x=>x.classList.toggle('drag-over',x===list))}},{passive:false});const finish=()=>{clearTimeout(timer);timer=null;if(touchCard){touchCard.classList.remove('touch-moving');document.querySelectorAll('.card-list').forEach(x=>{x.classList.remove('drag-over');save(x)});touchCard=null;setTimeout(()=>dragOccurred=false,0)}};board.addEventListener('pointerup',finish);board.addEventListener('pointercancel',finish);
createOpen.onclick=()=>{form.reset();form.action=dialog.dataset.createAction;document.getElementById('dialog-title').textContent='カードを登録';document.getElementById('submit-label').textContent='登録';dialog.showModal();title.focus()};document.getElementById('dialog-cancel').onclick=()=>dialog.close();document.getElementById('card-detail-close').onclick=()=>detailDialog.close();detailDialog.addEventListener('click',e=>{const rect=detailDialog.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)detailDialog.close()});document.querySelectorAll('.edit-button').forEach(b=>b.onclick=()=>{title.value=b.dataset.title;content.value=b.dataset.content||'';status.value=b.dataset.status;form.querySelector(`[name="color"][value="${b.dataset.color}"]`).checked=true;form.action='/group/kanban/'+encodeURIComponent(b.dataset.id)+'/update';document.getElementById('dialog-title').textContent='カードを編集';document.getElementById('submit-label').textContent='更新';dialog.showModal();title.focus()});refreshBoard();})();
</script>
</body></html>
