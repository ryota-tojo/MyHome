<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>所属グループ選択</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/theme.css}">
  <link rel="stylesheet" th:href="@{/css/polish.css}">
  <link rel="stylesheet" th:href="@{/css/actions.css}">
  <style>
    .group-select-page{width:min(80%,1100px);margin:48px auto;padding:0}
    .group-select-card{padding:clamp(24px,4vw,48px);border:1px solid #d8d8d8;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.07)}
    .group-select-card h1{margin:0 0 12px}
    .group-select-card>.description{margin:0 0 32px;color:#666}
    .choice-section+.choice-section{margin-top:32px;padding-top:28px;border-top:1px solid #ddd}
    .section-label{display:block;margin:0 0 14px;font-size:1.05rem;font-weight:700;color:#333}
    .group-list{display:grid;gap:12px}
    .group-choice-link{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;box-sizing:border-box;padding:18px 20px;border:1px solid #ccc;border-radius:10px;background:#f8f8f8;color:#222;text-decoration:none;transition:background-color .18s,border-color .18s,transform .18s}
    .group-choice-link:hover{background:#eee;border-color:#aaa;transform:translateY(-1px)}
    .group-name{font-weight:700;overflow-wrap:anywhere}
    .role-badge{flex:none;padding:4px 9px;border-radius:999px;background:#e8e8e8;font-size:.78rem}
    .empty-message{padding:22px;border:1px dashed #bbb;border-radius:10px;background:#fafafa;text-align:center;color:#666}
    .selection-actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
    .selection-actions form{margin:0}
    @media(max-width:700px){.group-select-page{width:94%;margin:24px auto}.group-select-card{padding:22px 18px}.selection-actions{display:flex;flex-direction:column;align-items:center;justify-content:center}.selection-actions form{display:block;width:min(100%,320px)!important;margin:0 auto!important}.selection-actions form button{display:block;width:100%!important;max-width:none!important;margin:0!important}.group-choice-link{padding:15px}}
  </style>
</head>
<body class="auth">
<main class="group-select-page">
  <section class="group-select-card">
    <h1>所属グループ選択</h1>
    <p class="description">利用する所属グループを選択してください。所属グループを選択せず、個人メニューへ進むこともできます。</p>

    <div class="choice-section">
      <span class="section-label">所属グループ一覧</span>
      <div class="group-list" th:if="${!#lists.isEmpty(groups)}">
        <a class="group-choice-link" th:each="g:${groups}" th:href="@{/groups/activate(groupId=${g.group_id})}">
          <span class="group-name" th:text="${g.group_name}"></span>
          <span class="role-badge" th:text="${g.leader_flag==1?'リーダー':'メンバー'}"></span>
        </a>
      </div>
      <div class="empty-message" th:if="${#lists.isEmpty(groups)}">現在、所属しているグループはありません。</div>
    </div>

    <div class="choice-section">
      <span class="section-label">その他の操作</span>
      <div class="selection-actions">
        <form th:action="@{/groups/without}" method="post"><button type="submit" class="secondary">所属グループを選択せずログイン</button></form>
        <form th:action="@{/logout}" method="post"><button type="submit" class="secondary">ログアウト</button></form>
      </div>
    </div>
  </section>
</main>
</body>
</html>
