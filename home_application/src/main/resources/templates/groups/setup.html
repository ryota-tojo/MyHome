<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>所属グループ作成</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/theme.css}">
    <link rel="stylesheet" th:href="@{/css/polish.css}">
    <link rel="stylesheet" th:href="@{/css/actions.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="title-area"><h1>所属グループ作成</h1></div>
    <div class="alert" th:if="${error}" th:text="${error}"></div>
    <section class="panel">
        <form class="registration-form" th:action="@{/groups/setup}" method="post"><label>所属グループ名 <input
                name="groupName" th:value="${groupName}" required
                maxlength="100"></label><label>所属グループパスワード<input type="password" name="password" required
                                                                            minlength="8"
                                                                            autocomplete="new-password"></label><label>パスワード（確認）<input
                type="password" name="confirmation" required minlength="8"
                autocomplete="new-password"></label>
            <div class="registration-form__actions">
                <button type="submit">作成して利用開始</button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
