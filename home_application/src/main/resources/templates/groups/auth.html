<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>所属グループ認証</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/theme.css}">
    <link rel="stylesheet" th:href="@{/css/polish.css}">
    <link rel="stylesheet" th:href="@{/css/actions.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="title-area"><h1>所属グループ認証</h1></div>
    <section class="panel"><h2 th:text="${group.group_name}"></h2>
        <p>所属グループのパスワードを入力してください。</p>
        <div class="alert" th:if="${error}" th:text="${error}"></div>
        <form class="registration-form" th:action="@{/groups/auth}" method="post"><input type="hidden" name="groupId"
                                                                                         th:value="${group.group_id}"><input
                type="hidden" name="returnTo" th:value="${returnTo}"><label>所属グループパスワード<input type="password"
                                                                                                         name="password"
                                                                                                         required
                                                                                                         autofocus></label>
            <div class="registration-form__actions"><a class="button-link secondary" th:href="${backUrl}">戻る</a>
                <button type="submit">認証して家計簿を開く</button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
