<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予算一覧（年間）</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><style>
.yearly-wrap{width:min(1600px,94vw);margin:auto}.year-toolbar{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.year-form{display:flex;align-items:end;gap:10px}.year-form label{margin:0}.year-form input{width:130px}.yearly-table-wrap{overflow:auto;border:1px solid #d9dfe5;border-radius:10px}.yearly-table{width:100%;min-width:1250px;border-collapse:collapse;background:#fff}.yearly-table th,.yearly-table td{padding:12px 10px;border-right:1px solid #e1e5e8;border-bottom:1px solid #e1e5e8;text-align:right;white-space:nowrap}.yearly-table th:first-child,.yearly-table td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}.yearly-table thead th{background:#f1f3f5}.yearly-table thead th:first-child{z-index:2;background:#f1f3f5}.yearly-table tfoot th,.yearly-table tfoot td{font-weight:700;background:#f5f7f8}.yearly-table tfoot th:first-child{background:#f5f7f8}.yearly-table .annual-total{font-weight:700;background:#f7fafc}@media(max-width:700px){.year-toolbar{align-items:stretch;flex-direction:column}.year-form input{width:100%}.year-form{display:grid;grid-template-columns:1fr auto}}
</style></head><body><header th:replace="~{fragments :: header}"></header><main><div class="title-area"><h1>予算一覧（年間）</h1></div><div class="yearly-wrap"><section class="panel"><div class="year-toolbar"><div><h2 th:text="|${year}年|">対象年</h2><p>カテゴリー別の年間予算です。</p></div><form class="year-form" method="get" th:action="@{/budgets/yearly}"><label>表示年<input type="number" name="year" min="2000" max="2100" th:value="${year}" required></label><button>表示</button></form></div><div class="yearly-table-wrap"><table class="yearly-table"><thead><tr><th>カテゴリー</th><th th:each="m:${#numbers.sequence(1,12)}" th:text="|${m}月|"></th><th>年間合計</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.category_name}"></td><td th:each="m:${#numbers.sequence(1,12)}" th:text="|${#numbers.formatInteger(r['m'+m],1,'COMMA')}円|"></td><td class="annual-total" th:text="|${#numbers.formatInteger(r.total,1,'COMMA')}円|"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="14">有効なカテゴリーがありません。</td></tr></tbody><tfoot><tr><th>月合計</th><td th:each="v:${monthTotals}" th:text="|${#numbers.formatInteger(v,1,'COMMA')}円|"></td><td class="annual-total" th:text="|${#numbers.formatInteger(yearTotal,1,'COMMA')}円|"></td></tr></tfoot></table></div></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
