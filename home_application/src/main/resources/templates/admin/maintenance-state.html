<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メンテナンス状態切替</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><link rel="stylesheet" th:href="@{/css/maintenance-state.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-area"><h1>メンテナンス状態切替</h1></div><div class="success" th:if="${param.saved}">メンテナンス状態を更新しました。</div><section class="panel maintenance-switch-panel"><div><h2>メンテナンス状態</h2><p th:text="${state.maintenance_enabled?'現在はメンテナンス中です。':'現在は通常稼働中です。'}"></p></div><form th:action="@{/admin/maintenance}" method="post"><label class="toggle-control"><input type="checkbox" name="enabled" value="true" th:checked="${state.maintenance_enabled}" onchange="const on=this.checked;if(confirm(on?'メンテナンスを有効にしますか？ 一般ユーザーはログインできなくなります。':'メンテナンスを解除しますか？')){this.form.submit()}else{this.checked=!on}"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-label" th:text="${state.maintenance_enabled?'有効':'無効'}"></span></label></form></section></main></body></html>
