<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バージョン情報登録</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main>
<div class="title-row"><h1>バージョン情報登録</h1><a th:href="@{/admin/versions}">一覧へ戻る</a></div>
<section class="panel"><form class="registration-form" th:action="@{/admin/versions}" method="post"><label>バージョン番号<input name="version" maxlength="100" required placeholder="例：4.1.0" autofocus></label><label>更新内容<textarea name="content" rows="9" maxlength="5000" required placeholder="このバージョンの変更内容を入力してください"></textarea></label><fieldset><legend>公開状態</legend><div class="radio-group"><label class="choice-row"><input type="radio" name="enabled" value="true" checked>有効</label><label class="choice-row"><input type="radio" name="enabled" value="false">無効</label></div></fieldset><div class="registration-form__actions"><button>登録</button></div></form></section>
</main></body></html>
