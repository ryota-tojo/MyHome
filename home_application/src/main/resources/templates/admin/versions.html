<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バージョン管理</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main>
<div class="title-area"><h1>バージョン管理</h1></div>
<form class="attached-search" method="get" th:action="@{/admin/versions}"><input name="q" th:value="${q}" placeholder="バージョン番号・更新内容を検索"><button>検索</button></form>
<div class="table-toolbar"><div class="table-toolbar__left"></div><a class="add-button" th:href="@{/admin/versions/new}" aria-label="バージョン情報登録">＋</a></div>
<section class="version-list"><article class="panel version-card" th:each="v:${versions}"><div class="version-card__heading"><div class="version-card__meta"><time><span>最終更新日：</span><span th:text="${v.updated_at}"></span></time><h3><a th:href="@{|/admin/versions/${v.id}|}" th:text="${v.version}"></a></h3></div><form class="version-card__toggle" th:action="@{|/admin/versions/${v.id}/toggle|}" method="post"><button class="secondary" th:text="${v.enabled?'有効（無効に切替）':'無効（有効に切替）'}"></button></form></div><hr><p class="version-card__content" th:text="${v.content}"></p></article><div class="panel empty-state" th:if="${#lists.isEmpty(versions)}">該当するバージョン情報はありません。</div></section>
<nav class="pagination"><a th:if="${page>1}" th:href="@{/admin/versions(page=${page-1},q=${q})}">前へ</a><span th:text="${page+' / '+pages}"></span><a th:if="${page<pages}" th:href="@{/admin/versions(page=${page+1},q=${q})}">次へ</a></nav>
</main></body></html>
