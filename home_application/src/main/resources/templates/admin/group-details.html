<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>所属グループ詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main>
<div class="title-row"><h1>所属グループ詳細</h1><a th:href="@{/admin/groups}">一覧へ戻る</a></div><div class="success" th:if="${param.updated}">更新しました。</div><div class="alert" th:if="${param.error}">最後のリーダーは解除・除籍できません。</div>
<section class="panel group-detail-panel"><h2>基本情報</h2><form class="user-detail-form" th:action="@{|/admin/groups/${group.group_id}/update|}" method="post" onsubmit="return confirm('所属グループ情報を更新しますか？')"><label>所属グループID<input name="groupId" th:value="${group.group_id}" required pattern="[A-Za-z0-9_-]{4,64}"></label><label>所属グループ表示名<input name="groupName" th:value="${group.group_name}" required></label><div class="form-actions"><button>更新</button></div></form></section>
<section class="panel"><h2>状態変更</h2><form class="password-reset-form" th:action="@{|/admin/groups/${group.group_id}/status|}" method="post" onsubmit="return confirm('無効化すると全メンバーとの有効な紐付けが解除されます。続行しますか？')"><div class="radio-group"><label class="choice-row"><input type="radio" name="status" value="ACTIVE" th:checked="${group.status=='ACTIVE'}">有効</label><label class="choice-row"><input type="radio" name="status" value="INACTIVE" th:checked="${group.status!='ACTIVE'}">無効</label></div><div class="form-actions"><button>状態変更</button></div></form></section>
<section class="panel"><h2>所属グループ情報</h2><dl class="detail-list"><dt>作成日時</dt><dd th:text="${group.create_date?:'-'}"></dd><dt>更新日時</dt><dd th:text="${group.update_date?:'-'}"></dd></dl><form th:action="@{|/admin/groups/${group.group_id}/delete|}" method="post" onsubmit="return confirm('この所属グループを削除しますか？')"><div class="form-actions"><button class="danger" th:disabled="${group.status!='INACTIVE'}">所属グループ削除</button></div></form></section>
<section class="panel"><h2>メンバー追加</h2><form class="password-reset-form" th:action="@{|/admin/groups/${group.group_id}/member|}" method="post"><label>ユーザー<select name="userId" required><option value="">選択してください</option><option th:each="u:${candidates}" th:value="${u.user_id}" th:text="${u.user_id+' / '+u.user_name}"></option></select></label><fieldset><legend>グループ権限</legend><div class="radio-group"><label class="choice-row"><input type="radio" name="leader" value="0" checked>メンバー</label><label class="choice-row"><input type="radio" name="leader" value="1">リーダー</label></div></fieldset><div class="form-actions"><button>追加</button></div></form></section>
<h2>所属メンバー</h2><form class="attached-search" method="get"><input name="q" th:value="${q}" placeholder="ユーザーID・表示名を検索"><input type="hidden" name="memberStatuses" th:value="${memberStatuses}"><input type="hidden" name="memberRoles" th:value="${memberRoles}"><input type="hidden" name="memberApprovals" th:value="${memberApprovals}"><input type="hidden" name="memberCreated" th:value="${memberCreated}"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><button>検索</button></form>
<div class="table-toolbar"><div class="table-toolbar__left"><span th:text="${'全'+memberTotal+'件'}"></span><div class="table-toolbar__resets"><a class="filter-reset" th:if="${!#strings.isEmpty(memberStatuses) or !#strings.isEmpty(memberRoles) or !#strings.isEmpty(memberApprovals) or !#strings.isEmpty(memberCreated)}" th:href="@{|/admin/groups/${group.group_id}?q=${q}&sort=${sort}&direction=${direction}|}">フィルタを解除</a><a class="filter-reset" th:if="${sort!='user_name' or direction!='asc'}" th:href="@{|/admin/groups/${group.group_id}?q=${q}&memberStatuses=${memberStatuses}&memberRoles=${memberRoles}&memberApprovals=${memberApprovals}&memberCreated=${memberCreated}|}">並び替えを解除</a></div></div></div>
<section class="panel table-wrap member-table-full"><table><thead><tr><th><button class="table-head-button" type="button" onclick="openMemberSettings('user_id','ユーザーID')">ユーザーID</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('user_name','表示名')">表示名</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('status','状態')">状態</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('leader_flag','グループ権限')">グループ権限</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('approve_flag','参加承認')">参加承認</button></th><th><button class="table-head-button" type="button" onclick="openMemberSettings('create_date','所属日時')">所属日時</button></th><th>操作</th></tr></thead><tbody><tr th:each="m:${members}"><td><a th:href="@{|/admin/users/${m.user_id}|}" th:text="${m.user_id}"></a></td><td th:text="${m.user_name}"></td><td th:text="${m.delete_flag==1?'無効':'有効'}"></td><td th:text="${m.leader_flag==1?'リーダー':'メンバー'}"></td><td th:text="${m.approve_flag==1?'承認済み':'未承認'}"></td><td th:text="${m.create_date}"></td><td class="actions"><form th:if="${m.approve_flag!=1}" th:action="@{|/admin/groups/${group.group_id}/members/${m.user_id}/approve|}" method="post"><button>承認</button></form><form th:action="@{|/admin/groups/${group.group_id}/members/${m.user_id}/leader|}" method="post"><button class="secondary" th:text="${m.leader_flag==1?'リーダー解除':'リーダー任命'}"></button></form><form th:action="@{|/admin/groups/${group.group_id}/members/${m.user_id}/remove|}" method="post" onsubmit="return confirm('このメンバーを除籍しますか？')"><button class="danger">除籍</button></form></td></tr><tr th:if="${#lists.isEmpty(members)}"><td colspan="7">該当する所属メンバーはいません。</td></tr></tbody></table></section>
<nav class="pagination"><a th:if="${page>1}" th:href="@{|/admin/groups/${group.group_id}?page=${page-1}&q=${q}&memberStatuses=${memberStatuses}&memberRoles=${memberRoles}&memberApprovals=${memberApprovals}&memberCreated=${memberCreated}&sort=${sort}&direction=${direction}|}">前へ</a><span th:text="${page+' / '+pages}"></span><a th:if="${page<pages}" th:href="@{|/admin/groups/${group.group_id}?page=${page+1}&q=${q}&memberStatuses=${memberStatuses}&memberRoles=${memberRoles}&memberApprovals=${memberApprovals}&memberCreated=${memberCreated}&sort=${sort}&direction=${direction}|}">次へ</a></nav>
<dialog id="member-column-settings" class="search-dialog column-dialog"><div class="search-dialog__heading"><h2 id="member-column-title">列の設定</h2><button type="button" class="search-dialog__close" onclick="this.closest('dialog').close()">×</button></div><form id="member-column-form" class="search-dialog__form" method="get"><input type="hidden" name="q" th:value="${q}"><input type="hidden" id="member-sort-value" name="sort" th:value="${sort}"><input type="hidden" id="member-statuses-value" name="memberStatuses" th:value="${memberStatuses}"><input type="hidden" id="member-roles-value" name="memberRoles" th:value="${memberRoles}"><input type="hidden" id="member-approvals-value" name="memberApprovals" th:value="${memberApprovals}">
<section class="column-setting" data-column="status"><h3>項目</h3><label class="choice-row"><input class="member-status-choice" type="checkbox" value="ACTIVE" th:checked="${#strings.isEmpty(memberStatuses) or #strings.contains(memberStatuses,'ACTIVE')}">有効</label><label class="choice-row"><input class="member-status-choice" type="checkbox" value="INACTIVE" th:checked="${#strings.isEmpty(memberStatuses) or #strings.contains(memberStatuses,'INACTIVE')}">無効</label></section>
<section class="column-setting" data-column="leader_flag"><h3>項目</h3><label class="choice-row"><input class="member-role-choice" type="checkbox" value="1" th:checked="${#strings.isEmpty(memberRoles) or #strings.contains(memberRoles,'1')}">リーダー</label><label class="choice-row"><input class="member-role-choice" type="checkbox" value="0" th:checked="${#strings.isEmpty(memberRoles) or #strings.contains(memberRoles,'0')}">メンバー</label></section>
<section class="column-setting" data-column="approve_flag"><h3>項目</h3><label class="choice-row"><input class="member-approval-choice" type="checkbox" value="1" th:checked="${#strings.isEmpty(memberApprovals) or #strings.contains(memberApprovals,'1')}">承認済み</label><label class="choice-row"><input class="member-approval-choice" type="checkbox" value="0" th:checked="${#strings.isEmpty(memberApprovals) or #strings.contains(memberApprovals,'0')}">未承認</label></section>
<section class="column-setting" data-column="create_date"><h3>項目</h3><label>日時の文字列<input name="memberCreated" th:value="${memberCreated}" placeholder="表示形式に合わせて入力"></label></section><section class="column-sort-setting"><h3>並び替え</h3><label class="choice-row"><input type="radio" name="direction" value="asc" th:checked="${direction=='asc'}">昇順</label><label class="choice-row"><input type="radio" name="direction" value="desc" th:checked="${direction=='desc'}">降順</label></section><div class="dialog-actions"><button type="button" class="secondary" onclick="this.closest('dialog').close()">キャンセル</button><button>適用</button></div></form></dialog>
<script>let currentMemberColumn='';function memberCsv(selector){const values=[...document.querySelectorAll(selector+':checked')].map(x=>x.value);return values.length?values.join(','):'NONE';}function openMemberSettings(column,title){currentMemberColumn=column;const d=document.getElementById('member-column-settings');d.querySelectorAll('.column-setting').forEach(x=>x.hidden=x.dataset.column!==column);document.getElementById('member-column-title').textContent=title+'の設定';document.getElementById('member-sort-value').value=column;d.showModal();}document.getElementById('member-column-form').addEventListener('submit',()=>{if(currentMemberColumn==='status')document.getElementById('member-statuses-value').value=memberCsv('.member-status-choice');if(currentMemberColumn==='leader_flag')document.getElementById('member-roles-value').value=memberCsv('.member-role-choice');if(currentMemberColumn==='approve_flag')document.getElementById('member-approvals-value').value=memberCsv('.member-approval-choice');});</script>
<section class="panel table-wrap"><h2>対象所属グループの操作履歴</h2><table><thead><tr><th class="nowrap">日時</th><th class="nowrap">ユーザー</th><th>画面</th><th>操作</th><th>結果</th><th>メッセージ</th></tr></thead><tbody><tr th:each="l:${groupLogs}"><td class="nowrap" th:text="${l.created_at}"></td><td class="nowrap" th:text="${l.user_id?:'-'}"></td><td th:text="${l.screen_name}"></td><td th:text="${l.action_name}"></td><td th:text="${l.result_name}"></td><td th:text="${l.detail_display}"></td></tr><tr th:if="${#lists.isEmpty(groupLogs)}"><td colspan="6">操作履歴はありません。</td></tr></tbody></table></section><nav class="pagination"><a th:if="${logPage>1}" th:href="@{|/admin/groups/${group.group_id}?logPage=${logPage-1}|}">前へ</a><span th:text="${logPage+' / '+logPages}"></span><a th:if="${logPage<logPages}" th:href="@{|/admin/groups/${group.group_id}?logPage=${logPage+1}|}">次へ</a></nav>
</main></body></html>
