<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メンテナンス</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-area"><h1>メンテナンス・バージョン</h1></div><div class="success" th:if="${param.saved}">更新しました。</div><section id="maintenance-state" class="panel"><h2>メンテナンス状態切り替え</h2><form th:action="@{/admin/maintenance}" method="post" onsubmit="return confirm('メンテナンス状態を変更しますか？')"><label><input type="checkbox" name="enabled" value="true" th:checked="${state.maintenance_enabled}"> メンテナンスON</label><label>理由<input name="reason" th:value="${state.maintenance_reason}"></label><label>一般ユーザー向けメッセージ<input name="message" th:value="${state.maintenance_message}"></label><button>状態を保存</button></form></section><section id="version-management" class="panel"><h2>バージョン情報登録</h2><form class="form-grid" th:action="@{/admin/versions}" method="post"><label>バージョン番号<input name="version" required></label><label class="wide">更新内容<input name="content" required></label><label><input type="checkbox" name="enabled" value="true" checked> 有効</label><button>登録</button></form></section><h2>バージョン情報一覧</h2><section class="version-grid"><article class="panel" th:each="v:${versions}"><h3><a th:href="@{|/admin/versions/${v.id}|}" th:text="${v.version}"></a></h3><p th:text="${v.content}"></p><time th:text="${v.published_at}"></time><span th:text="${v.enabled?'有効':'無効'}"></span><form th:action="@{|/admin/versions/${v.id}/toggle|}" method="post"><button class="secondary">有効・無効切替</button></form></article></section><nav class="pagination"><a th:if="${page>1}" th:href="@{/admin/maintenance(page=${page-1})}">前へ</a><span th:text="${page+' / '+pages}"></span><a th:if="${page<pages}" th:href="@{/admin/maintenance(page=${page+1})}">次へ</a></nav></main></body></html>
