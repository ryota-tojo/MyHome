<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>データバックアップ</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/polish.css}">
    <link rel="stylesheet" th:href="@{/css/actions.css}">
</head>
<body class="admin-page">
<header th:replace="~{fragments :: admin-header}"></header>
<main>
    <div class="title-area"><h1>データバックアップ</h1></div>
    <section class="panel"><h2>現在のデータ件数</h2>
        <div class="count-grid"><span th:each="c:${counts}" th:text="${c.key+'：'+c.value}"></span><span
                th:text="${'所属グループ画像：'+homeImageCount}"></span><span
                th:text="${'アップロードフォント：'+fontCount}"></span></div>
    </section>
    <section class="panel"><p>
        アプリケーション全体のDBデータ、所属グループが設定したホーム画像、アップロードフォントをJSONバックアップとして出力します。</p>
        <a class="button-link" th:href="@{/admin/data/export}">バックアップをエクスポート</a></section>
</main>
</body>
</html>
