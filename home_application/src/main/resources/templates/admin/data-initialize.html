<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>データ初期化</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/theme.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" th:href="@{/css/polish.css}">
  <link rel="stylesheet" th:href="@{/css/actions.css}">
</head>
<body class="admin-page">
<header th:replace="~{fragments :: admin-header}"></header>
<main>
  <div class="title-area"><h1>データ初期化</h1></div>
  <div class="alert" th:if="${param.error}">確認文字列または管理者パスワードが正しくありません。</div>
  <section class="panel">
    <h2>初期化対象件数</h2>
    <div class="count-grid"><span th:each="c:${counts}" th:text="${c.key+'：'+c.value}"></span></div>
  </section>
  <section class="panel danger-zone">
    <h2>アプリケーションを初期状態に戻す</h2>
    <p>ユーザー、所属グループ、家計簿、ログ、バージョン、システム設定、表示設定、メンテナンス状態を削除し、構築直後の状態へ戻します。</p>
    <p><strong>初期化後はログアウトされます。</strong>初期管理者 <code>admin</code> が再作成され、初回ログイン時にパスワード変更が必要です。</p>
    <button type="button" class="danger" id="open-initialize-dialog">データを初期化</button>
  </section>
</main>
<dialog id="initialize-dialog" class="confirm-dialog">
  <form th:action="@{/admin/data/initialize}" method="post">
    <div class="confirm-dialog__body">
      <h2>データ初期化の最終確認</h2>
      <p>この操作は取り消せません。必要なデータは事前にバックアップしてください。</p>
      <label>確認文字列「INITIALIZE」
        <input name="confirmation" autocomplete="off" pattern="INITIALIZE" required>
      </label>
      <label>現在の管理者パスワード
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
    </div>
    <div class="confirm-dialog__actions">
      <button type="button" class="secondary" id="close-initialize-dialog">キャンセル</button>
      <button type="submit" class="danger">完全に初期化する</button>
    </div>
  </form>
</dialog>
<script>
  const dialog = document.getElementById('initialize-dialog');
  document.getElementById('open-initialize-dialog').addEventListener('click', () => dialog.showModal());
  document.getElementById('close-initialize-dialog').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => {
    if (event.target === dialog) dialog.close();
  });
</script>
</body>
</html>
