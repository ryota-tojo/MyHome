<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>所属グループ一覧</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main>
<div class="title-area"><h1>所属グループ一覧</h1></div><form class="attached-search" method="get"><input name="q" th:value="${q}" placeholder="所属グループID・表示名を検索"><input type="hidden" name="statuses" th:value="${statuses}"><input type="hidden" name="leaders" th:value="${leaders}"><input type="hidden" name="memberCount" th:value="${memberCount}"><input type="hidden" name="pendingCount" th:value="${pendingCount}"><input type="hidden" name="created" th:value="${created}"><input type="hidden" name="updated" th:value="${updated}"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><button>検索</button></form>
<div class="table-toolbar"><div class="table-toolbar__left"><span th:text="${'全'+total+'件'}"></span><div class="table-toolbar__resets"><a class="filter-reset" th:if="${!#strings.isEmpty(statuses) or !#strings.isEmpty(leaders) or !#strings.isEmpty(memberCount) or !#strings.isEmpty(pendingCount) or !#strings.isEmpty(created) or !#strings.isEmpty(updated)}" th:href="@{/admin/groups(q=${q},sort=${sort},direction=${direction})}">フィルタを解除</a><a class="filter-reset" th:if="${sort!='create_date' or direction!='desc'}" th:href="@{/admin/groups(q=${q},statuses=${statuses},leaders=${leaders},memberCount=${memberCount},pendingCount=${pendingCount},created=${created},updated=${updated})}">並び替えを解除</a></div></div><a class="add-button" th:href="@{/admin/groups/new}" aria-label="所属グループ登録">＋</a></div>
<section class="panel table-wrap"><table><thead><tr><th><button class="table-head-button" type="button" onclick="openColumnSettings('group_id','ID')">ID</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('group_name','表示名')">表示名</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('status','状態')">状態</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('leaders','リーダー')">リーダー</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('member_count','メンバー')">メンバー</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('pending_count','承認待ち')">承認待ち</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('create_date','作成日')">作成日</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('update_date','更新日')">更新日</button></th></tr></thead><tbody><tr th:each="r:${rows}"><td><a th:href="@{|/admin/groups/${r.group_id}|}" th:text="${r.group_id}"></a></td><td th:text="${r.group_name}"></td><td th:text="${r.status}"></td><td th:text="${r.leaders?:'-'}"></td><td th:text="${r.member_count}"></td><td th:text="${r.pending_count}"></td><td th:text="${r.create_date}"></td><td th:text="${r.update_date}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="8">対象グループはありません。</td></tr></tbody></table></section>
<nav class="pagination"><a th:if="${page>1}" th:href="@{/admin/groups(page=${page-1},q=${q},statuses=${statuses},leaders=${leaders},memberCount=${memberCount},pendingCount=${pendingCount},created=${created},updated=${updated},sort=${sort},direction=${direction})}">前へ</a><span th:text="${page+' / '+pages}"></span><a th:if="${page<pages}" th:href="@{/admin/groups(page=${page+1},q=${q},statuses=${statuses},leaders=${leaders},memberCount=${memberCount},pendingCount=${pendingCount},created=${created},updated=${updated},sort=${sort},direction=${direction})}">次へ</a></nav>
<dialog id="column-settings" class="search-dialog column-dialog"><div class="search-dialog__heading"><h2 id="column-title">列の設定</h2><button type="button" class="search-dialog__close" onclick="this.closest('dialog').close()">×</button></div><form id="column-form" class="search-dialog__form" method="get"><input type="hidden" name="q" th:value="${q}"><input type="hidden" id="sort-value" name="sort" th:value="${sort}"><input type="hidden" id="statuses-value" name="statuses" th:value="${statuses}">
<section class="column-setting" data-column="status"><h3>項目</h3><label class="choice-row"><input class="status-choice" type="checkbox" value="ACTIVE" th:checked="${#strings.isEmpty(statuses) or #strings.contains(statuses,'ACTIVE')}">有効</label><label class="choice-row"><input class="status-choice" type="checkbox" value="INACTIVE" th:checked="${#strings.isEmpty(statuses) or #strings.contains(statuses,'INACTIVE')}">無効</label><label class="choice-row"><input class="status-choice" type="checkbox" value="DELETED" th:checked="${#strings.isEmpty(statuses) or #strings.contains(statuses,'DELETED')}">削除済み</label></section>
<section class="column-setting" data-column="leaders"><h3>項目</h3><label>含まれるキーワード<input name="leaders" th:value="${leaders}"></label></section><section class="column-setting" data-column="member_count"><h3>項目</h3><label>含まれる数値<input name="memberCount" th:value="${memberCount}" inputmode="numeric"></label></section><section class="column-setting" data-column="pending_count"><h3>項目</h3><label>含まれる数値<input name="pendingCount" th:value="${pendingCount}" inputmode="numeric"></label></section><section class="column-setting" data-column="create_date"><h3>項目</h3><label>日時の文字列<input name="created" th:value="${created}" placeholder="表示形式に合わせて入力"></label></section><section class="column-setting" data-column="update_date"><h3>項目</h3><label>日時の文字列<input name="updated" th:value="${updated}" placeholder="表示形式に合わせて入力"></label></section>
<section class="column-sort-setting"><h3>並び替え</h3><label class="choice-row"><input type="radio" name="direction" value="asc" th:checked="${direction=='asc'}">昇順</label><label class="choice-row"><input type="radio" name="direction" value="desc" th:checked="${direction=='desc'}">降順</label></section><div class="dialog-actions"><button type="button" class="secondary" onclick="this.closest('dialog').close()">キャンセル</button><button>適用</button></div></form></dialog>
<script>let currentColumn='';function openColumnSettings(column,title){currentColumn=column;const d=document.getElementById('column-settings');d.querySelectorAll('.column-setting').forEach(x=>x.hidden=x.dataset.column!==column);document.getElementById('column-title').textContent=title+'の設定';document.getElementById('sort-value').value=column;d.showModal();}document.getElementById('column-form').addEventListener('submit',()=>{if(currentColumn==='status'){const values=[...document.querySelectorAll('.status-choice:checked')].map(x=>x.value);document.getElementById('statuses-value').value=values.length?values.join(','):'NONE';}});</script>
</main></body></html>
