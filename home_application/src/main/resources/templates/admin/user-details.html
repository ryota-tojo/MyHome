<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユーザー詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main class="detail-form-width">
<div class="title-row"><h1>ユーザー詳細</h1><a th:href="@{/admin/users}">一覧へ戻る</a></div><div class="success" th:if="${param.updated}">更新しました。</div><div class="alert" th:if="${param.error}">入力内容または保護条件により更新できません。</div>
<section class="panel"><h2>基本情報</h2><form class="user-detail-form" th:action="@{|/admin/users/${user.user_id}/update|}" method="post" onsubmit="return confirm('ユーザー情報を更新しますか？')"><label>ユーザーID<input name="userId" th:value="${user.user_id}" required pattern="[A-Za-z0-9_-]{4,64}"></label><label>ユーザー表示名<input name="userName" th:value="${user.user_name}" required></label><div class="form-actions"><button>更新</button></div></form></section>
<section class="panel"><h2>状態変更</h2><form class="password-reset-form" th:action="@{|/admin/users/${user.user_id}/status|}" method="post"><div class="radio-group"><label class="choice-row"><input type="radio" name="disabled" value="0" th:checked="${user.delete_flag!=1}">有効</label><label class="choice-row"><input type="radio" name="disabled" value="1" th:checked="${user.delete_flag==1}">無効</label></div><div class="form-actions"><button th:disabled="${user.permission_flag==2}">状態変更</button></div></form></section>
<section class="panel"><h2>ユーザー情報</h2><dl class="detail-list"><dt>システム権限</dt><dd th:text="${user.permission_flag==2?'管理者':'一般ユーザー'}"></dd><dt>最終ログイン</dt><dd th:text="${user.last_login_at?:'-'}"></dd><dt>ログイン失敗回数</dt><dd th:text="${user.login_failure_count}"></dd><dt>ロック期限</dt><dd th:text="${user.locked_until?:'-'}"></dd><dt>パスワード最終変更</dt><dd th:text="${user.password_changed_at?:'-'}"></dd><dt>作成日時</dt><dd th:text="${user.create_date}"></dd><dt>更新日時</dt><dd th:text="${user.update_date}"></dd></dl><form th:action="@{|/admin/users/${user.user_id}/unlock|}" method="post"><div class="form-actions"><button class="secondary" th:disabled="${!userLocked}">アカウントロック解除</button></div></form><form th:if="${user.permission_flag!=2}" th:action="@{|/admin/users/${user.user_id}/delete|}" method="post" onsubmit="return confirm('このユーザーを削除し、全グループとの紐付けを解除しますか？')"><div class="form-actions"><button class="danger" th:disabled="${user.delete_flag!=1}">ユーザー削除</button></div></form></section>
<section class="panel"><h2>パスワード再設定</h2><form class="password-reset-form" th:action="@{|/admin/users/${user.user_id}/reset-password|}" method="post"><label>パスワード<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><label>パスワード確認<input type="password" name="confirmation" minlength="8" required autocomplete="new-password"></label><div class="form-actions"><button>再設定</button></div></form></section>
<h2>所属グループ情報</h2><section class="user-group-list"><article class="panel user-group-card" th:each="g:${groups}"><div class="user-group-card__heading"><div><h3><a th:href="@{|/admin/groups/${g.group_id}|}" th:text="${g.group_name}"></a></h3><small th:text="${g.group_id}"></small></div><div class="user-group-card__status"><strong th:text="${g.leader_flag==1?'リーダー':'メンバー'}"></strong><span th:text="${g.approve_flag==1?'参加承認済み':'参加承認待ち'}"></span></div></div><hr><div class="user-group-card__content"><span>購入データ<strong th:text="${g.shopping_count}"></strong></span><span>収入合計<strong th:text="${g.income_total}"></strong></span><span>支出合計<strong th:text="${g.expense_total}"></strong></span><span>カテゴリ<strong th:text="${g.category_count}"></strong></span><span>予算<strong th:text="${g.budget_count}"></strong></span></div></article><div class="panel empty-state" th:if="${#lists.isEmpty(groups)}">所属グループはありません。</div></section>
<section class="panel table-wrap"><h2>対象ユーザーの操作履歴</h2><table><tr><th class="nowrap">日時</th><th>画面</th><th>操作</th><th>結果</th><th>メッセージ</th></tr><tr th:each="l:${logs}"><td class="nowrap" th:text="${l.created_at}"></td><td th:text="${l.screen_name}"></td><td th:text="${l.action_name}"></td><td th:text="${l.result_name}"></td><td th:text="${l.detail_display}"></td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="5">操作履歴はありません。</td></tr></table></section><nav class="pagination"><a th:if="${logPage>1}" th:href="@{|/admin/users/${user.user_id}?logPage=${logPage-1}|}">前へ</a><span th:text="${logPage+' / '+logPages}"></span><a th:if="${logPage<logPages}" th:href="@{|/admin/users/${user.user_id}?logPage=${logPage+1}|}">次へ</a></nav>
</main></body></html>
