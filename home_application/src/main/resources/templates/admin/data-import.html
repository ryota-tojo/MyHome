<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データ入れ替え</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-area"><h1>データ入れ替え</h1></div><div class="success" th:if="${param.imported}">DBデータと所属グループ画像をバックアップ内容へ入れ替えました。</div><div class="alert" th:if="${param.error}">バックアップファイル、画像データまたは確認文字列を確認してください。</div><section class="panel danger-zone"><p>既存のDBデータと所属グループ画像をバックアップファイルの内容で全置換します。旧形式のバックアップはDBデータのみ入れ替え、現在の画像ファイルを保持します。</p><form th:action="@{/admin/data/import}" method="post" enctype="multipart/form-data" onsubmit="return confirm('既存データと所属グループ画像を全置換しますか？')"><label>バックアップファイル<input type="file" name="backup" accept="application/json,.json" required></label><label>確認文字列「IMPORT」<input name="confirmation" required></label><button class="danger">データを入れ替える</button></form></section></main></body></html>
