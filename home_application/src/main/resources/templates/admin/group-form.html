<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>所属グループ登録</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head>
<body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-row"><h1>所属グループ登録</h1><a th:href="@{/admin/groups}">一覧へ戻る</a></div><div class="alert" th:if="${error}" th:text="${error}"></div>
<section class="panel"><form class="registration-form" th:action="@{/admin/groups/new}" method="post" onsubmit="return confirm('所属グループを登録しますか？')"><label>グループID<input name="groupId" required maxlength="64"></label><label>表示名<input name="groupName" required maxlength="100"></label><label>パスワード<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>パスワード確認<input type="password" name="confirmation" required minlength="8" autocomplete="new-password"></label>
<fieldset><legend>状態</legend><div class="radio-group"><label><input type="radio" name="status" value="ACTIVE" checked>有効</label><label><input type="radio" name="status" value="INACTIVE">無効</label></div></fieldset>
<div><span class="field-label">所属メンバー</span><div class="multi-check" data-card-target="selected-member-cards"><button class="multi-check__toggle" type="button" aria-expanded="false">選択してください</button><div class="multi-check__menu" hidden><input class="multi-check__search" type="search" placeholder="ユーザーを検索" th:if="${#lists.size(users)>selectSearchThreshold}"><label th:each="u:${users}"><input class="multi-check__choice" type="checkbox" name="memberIds" th:value="${u.user_id}" th:attr="data-label=${u.user_name}"><span th:text="${u.user_name+' / '+u.user_id}"></span></label></div></div><div id="selected-member-cards" class="selected-group-cards"></div><small>少なくとも1名をリーダーに設定してください。</small></div>
<div class="registration-form__actions"><button type="submit">登録</button></div></form></section></main></body></html>
