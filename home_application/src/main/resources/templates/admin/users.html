<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユーザー一覧</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main>
<div class="title-area"><h1>ユーザー一覧</h1></div><form class="attached-search" method="get"><input name="q" th:value="${q}" placeholder="ユーザーID・表示名を検索"><input type="hidden" name="permissions" th:value="${permissions}"><input type="hidden" name="statuses" th:value="${statuses}"><input type="hidden" name="group" th:value="${group}"><input type="hidden" name="lastLogin" th:value="${lastLogin}"><input type="hidden" name="created" th:value="${created}"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><button>検索</button></form>
<div class="table-toolbar"><div class="table-toolbar__left"><span th:text="${'全'+total+'件'}"></span><div class="table-toolbar__resets"><a class="filter-reset" th:if="${!#strings.isEmpty(permissions) or !#strings.isEmpty(statuses) or !#strings.isEmpty(group) or !#strings.isEmpty(lastLogin) or !#strings.isEmpty(created)}" th:href="@{/admin/users(q=${q},sort=${sort},direction=${direction})}">フィルタを解除</a><a class="filter-reset" th:if="${sort!='create_date' or direction!='desc'}" th:href="@{/admin/users(q=${q},permissions=${permissions},statuses=${statuses},group=${group},lastLogin=${lastLogin},created=${created})}">並び替えを解除</a></div></div><a class="add-button" th:href="@{/admin/users/new}" aria-label="ユーザー登録">＋</a></div>
<section class="panel table-wrap"><table><thead><tr><th><button class="table-head-button" type="button" onclick="openColumnSettings('user_id','ID')">ID</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('user_name','表示名')">表示名</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('permission_flag','権限')">権限</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('status','状態')">状態</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('group','所属グループ')">所属グループ</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('last_login_at','最終ログイン')">最終ログイン</button></th><th><button class="table-head-button" type="button" onclick="openColumnSettings('create_date','作成日')">作成日</button></th><th>操作</th></tr></thead><tbody><tr th:each="r:${rows}"><td><a th:href="@{|/admin/users/${r.user_id}|}" th:text="${r.user_id}"></a></td><td th:text="${r.user_name}"></td><td th:text="${r.permission_flag==2?'管理者':'一般'}"></td><td th:text="${r.delete_flag==1?'無効':'有効'}"></td><td th:text="${r.groups?:'-'}"></td><td th:text="${r.last_login_at?:'-'}"></td><td th:text="${r.create_date}"></td><td class="actions"><form th:if="${r.permission_flag!=2}" th:action="@{|/admin/users/${r.user_id}/toggle-disabled|}" method="post"><button class="secondary" th:text="${r.delete_flag==1?'有効化':'無効化'}"></button></form><span th:if="${r.permission_flag==2}">―</span></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="8">対象ユーザーはありません。</td></tr></tbody></table></section>
<nav class="pagination"><a th:if="${page>1}" th:href="@{/admin/users(page=${page-1},q=${q},permissions=${permissions},statuses=${statuses},group=${group},lastLogin=${lastLogin},created=${created},sort=${sort},direction=${direction})}">前へ</a><span th:text="${page+' / '+pages}"></span><a th:if="${page<pages}" th:href="@{/admin/users(page=${page+1},q=${q},permissions=${permissions},statuses=${statuses},group=${group},lastLogin=${lastLogin},created=${created},sort=${sort},direction=${direction})}">次へ</a></nav>
<dialog id="column-settings" class="search-dialog column-dialog"><div class="search-dialog__heading"><h2 id="column-title">列の設定</h2><button type="button" class="search-dialog__close" onclick="this.closest('dialog').close()">×</button></div><form id="column-form" class="search-dialog__form" method="get"><input type="hidden" name="q" th:value="${q}"><input type="hidden" id="sort-value" name="sort" th:value="${sort}"><input type="hidden" id="permissions-value" name="permissions" th:value="${permissions}"><input type="hidden" id="statuses-value" name="statuses" th:value="${statuses}">
<section class="column-setting" data-column="permission_flag"><h3>項目</h3><label class="choice-row"><input class="permission-choice" type="checkbox" value="2" th:checked="${#strings.isEmpty(permissions) or #strings.contains(permissions,'2')}">管理者</label><label class="choice-row"><input class="permission-choice" type="checkbox" value="1" th:checked="${#strings.isEmpty(permissions) or #strings.contains(permissions,'1')}">一般ユーザー</label></section>
<section class="column-setting" data-column="status"><h3>項目</h3><label class="choice-row"><input class="status-choice" type="checkbox" value="ACTIVE" th:checked="${#strings.isEmpty(statuses) or #strings.contains(statuses,'ACTIVE')}">有効</label><label class="choice-row"><input class="status-choice" type="checkbox" value="INACTIVE" th:checked="${#strings.isEmpty(statuses) or #strings.contains(statuses,'INACTIVE')}">無効</label></section>
<section class="column-setting" data-column="group"><h3>項目</h3><label>含まれるキーワード<input name="group" th:value="${group}"></label></section><section class="column-setting" data-column="last_login_at"><h3>項目</h3><label>日時の文字列<input name="lastLogin" th:value="${lastLogin}" placeholder="表示形式に合わせて入力"></label></section><section class="column-setting" data-column="create_date"><h3>項目</h3><label>日時の文字列<input name="created" th:value="${created}" placeholder="表示形式に合わせて入力"></label></section>
<section class="column-sort-setting"><h3>並び替え</h3><label class="choice-row"><input type="radio" name="direction" value="asc" th:checked="${direction=='asc'}">昇順</label><label class="choice-row"><input type="radio" name="direction" value="desc" th:checked="${direction=='desc'}">降順</label></section><div class="dialog-actions"><button type="button" class="secondary" onclick="this.closest('dialog').close()">キャンセル</button><button>適用</button></div></form></dialog>
<script>let currentColumn='';function selectedCsv(selector){const values=[...document.querySelectorAll(selector+':checked')].map(x=>x.value);return values.length?values.join(','):'NONE';}function openColumnSettings(column,title){currentColumn=column;const d=document.getElementById('column-settings');d.querySelectorAll('.column-setting').forEach(x=>x.hidden=x.dataset.column!==column);document.getElementById('column-title').textContent=title+'の設定';document.getElementById('sort-value').value=column;d.showModal();}document.getElementById('column-form').addEventListener('submit',()=>{if(currentColumn==='permission_flag')document.getElementById('permissions-value').value=selectedCsv('.permission-choice');if(currentColumn==='status')document.getElementById('statuses-value').value=selectedCsv('.status-choice');});</script>
</main></body></html>
