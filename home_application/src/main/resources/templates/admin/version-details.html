<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>バージョン詳細</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/theme.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}">
<link rel="stylesheet" th:href="@{/css/polish.css}">
<link rel="stylesheet" th:href="@{/css/actions.css}">
</head>
<body class="admin-page">
<header th:replace="~{fragments :: admin-header}">
</header>
<main>
<div class="title-row">
<h1>バージョン詳細</h1>
<a th:href="@{/admin/versions}">一覧へ戻る</a>
</div>
<div class="success" th:if="${param.updated}">更新しました。</div>
<section class="panel">
<form class="registration-form" th:action="@{|/admin/versions/${version.id}/update|}" method="post">
<label>バージョン番号<input name="version" th:value="${version.version}" required>
</label>
<label>更新内容<textarea name="content" rows="10" required th:text="${version.content}">
</textarea>
</label>
<fieldset>
<legend>公開状態</legend>
<div class="radio-group">
<label class="choice-row"><input type="radio" name="enabled" value="true" th:checked="${version.enabled}">有効</label>
<label class="choice-row"><input type="radio" name="enabled" value="false" th:checked="${!version.enabled}">無効</label>
</div>
</fieldset>
<p th:text="${'公開日時：'+version.published_at}">
</p>
<p th:text="${'更新日時：'+version.updated_at}">
</p>
<div class="registration-form__actions"><button>更新</button></div>
</form>
<form th:action="@{|/admin/versions/${version.id}/delete|}" method="post" onsubmit="return confirm('このバージョン情報を削除しますか？')">
<button class="danger">削除</button>
</form>
</section>
</main>
</body>
</html>
