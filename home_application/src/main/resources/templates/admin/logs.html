<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作ログ</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"><style>.log-nowrap{white-space:nowrap}</style></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-area"><h1>操作ログ</h1></div>
<form class="attached-search" method="get"><input name="q" th:value="${q}" placeholder="操作ログ全体を検索"><input type="hidden" name="user" th:value="${user}"><input type="hidden" name="screen" th:value="${screen}"><input type="hidden" name="action" th:value="${action}"><input type="hidden" name="result" th:value="${result}"><input type="hidden" name="content" th:value="${content}"><input type="hidden" name="from" th:value="${from}"><input type="hidden" name="to" th:value="${to}"><button>検索</button></form>
<div class="table-toolbar"><div class="table-toolbar__left"><span th:text="${'全'+total+'件'}"></span><div class="table-toolbar__resets"><a class="filter-reset" th:if="${!#strings.isEmpty(user) or !#strings.isEmpty(screen) or !#strings.isEmpty(action) or !#strings.isEmpty(result) or !#strings.isEmpty(content) or !#strings.isEmpty(from) or !#strings.isEmpty(to)}" th:href="@{/admin/logs(q=${q})}">フィルタを解除</a></div></div></div>
<section class="panel table-wrap"><table><thead><tr><th class="log-nowrap"><button class="table-head-button" type="button" onclick="openLogFilter('datetime','日時')">日時</button></th><th class="log-nowrap"><button class="table-head-button" type="button" onclick="openLogFilter('user','ユーザー')">ユーザー</button></th><th><button class="table-head-button" type="button" onclick="openLogFilter('screen','画面')">画面</button></th><th><button class="table-head-button" type="button" onclick="openLogFilter('action','操作')">操作</button></th><th><button class="table-head-button" type="button" onclick="openLogFilter('result','結果')">結果</button></th><th><button class="table-head-button" type="button" onclick="openLogFilter('content','メッセージ')">メッセージ</button></th></tr></thead><tbody><tr th:each="r:${rows}"><td class="log-nowrap" th:text="${r.created_at}"></td><td class="log-nowrap"><strong th:text="${r.user_name?:r.user_id?:'-'}"></strong><small th:if="${r.user_name!=null and r.user_id!=null}" th:text="${r.user_id}"></small></td><td th:text="${r.screen_name}" th:title="${r.path}"></td><td th:text="${r.action_name}"></td><td th:text="${r.result_name}"></td><td th:text="${r.detail_display}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="6">対象ログはありません。</td></tr></tbody></table></section>
<nav class="pagination"><a th:if="${page>1}" th:href="@{/admin/logs(page=${page-1},q=${q},user=${user},screen=${screen},action=${action},result=${result},content=${content},from=${from},to=${to})}">前へ</a><span th:text="${page+' / '+pages}"></span><a th:if="${page<pages}" th:href="@{/admin/logs(page=${page+1},q=${q},user=${user},screen=${screen},action=${action},result=${result},content=${content},from=${from},to=${to})}">次へ</a></nav>
<dialog id="log-filter" class="search-dialog column-dialog"><div class="search-dialog__heading"><h2 id="log-filter-title">列のフィルタ</h2><button type="button" class="search-dialog__close" onclick="this.closest('dialog').close()">×</button></div><form class="search-dialog__form" method="get"><input type="hidden" name="q" th:value="${q}"><section class="column-setting" data-column="datetime"><label>From日時<input type="datetime-local" step="1" name="from" th:value="${from}"></label><label>To日時<input type="datetime-local" step="1" name="to" th:value="${to}"></label></section><section class="column-setting" data-column="user"><label>含まれるユーザー名<input name="user" th:value="${user}"></label></section><section class="column-setting" data-column="screen"><label>含まれる画面名<input name="screen" th:value="${screen}"></label></section><section class="column-setting" data-column="action"><label>含まれる操作名<input name="action" th:value="${action}"></label></section><section class="column-setting" data-column="result"><label>含まれる結果<input name="result" th:value="${result}"></label></section><section class="column-setting" data-column="content"><label>含まれるメッセージ<input name="content" th:value="${content}"></label></section><div class="dialog-actions"><button type="button" class="secondary" onclick="this.closest('dialog').close()">キャンセル</button><button>適用</button></div></form></dialog>
<script>function openLogFilter(column,title){const d=document.getElementById('log-filter');d.querySelectorAll('.column-setting').forEach(x=>x.hidden=x.dataset.column!==column);document.getElementById('log-filter-title').textContent=title+'のフィルタ';d.showModal();}</script></main></body></html>
