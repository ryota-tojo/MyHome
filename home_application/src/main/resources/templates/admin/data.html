<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データ管理</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-area"><h1>データ管理</h1></div><div class="success" th:if="${param.imported}">バックアップを復元しました。</div><div class="alert" th:if="${param.error}">処理できませんでした。ファイル、確認文字列、管理者パスワードを確認してください。</div><section class="panel"><h2>現在のデータ件数</h2><div class="count-grid"><span th:each="c:${counts}" th:text="${c.key+'：'+c.value}"></span></div></section><section id="data-backup" class="panel"><h2>データバックアップ</h2><p>アプリケーション全体をJSONバックアップとして出力します。</p><a class="button-link" th:href="@{/admin/data/export}">バックアップをエクスポート</a><hr id="data-import"><h3>データ入れ替え</h3><form th:action="@{/admin/data/import}" method="post" enctype="multipart/form-data" onsubmit="return confirm('既存データをバックアップ内容で全置換しますか？')"><label>バックアップファイル<input type="file" name="backup" accept="application/json,.json" required></label><label>確認文字列「IMPORT」<input name="confirmation" required></label><button class="danger">インポートして全置換</button></form></section><section id="data-initialize" class="panel danger-zone"><h2>データ初期化</h2><p>家計簿・ユーザー・グループ・ログを削除し、初期管理者 admin を再作成します。</p><form th:action="@{/admin/data/initialize}" method="post" onsubmit="return confirm('本当にすべてのデータを初期化しますか？')"><label>確認文字列「INITIALIZE」<input name="confirmation" required></label><label>現在の管理者パスワード<input type="password" name="password" required></label><button class="danger">アプリケーションを初期化</button></form></section></main></body></html>
