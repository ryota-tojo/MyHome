<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者ダッシュボード</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-area"><h1>管理者ダッシュボード</h1></div><div class="success" th:if="${param.passwordChanged}">パスワードを変更しました。</div><section class="admin-cards"><article><span>総ユーザー</span><strong th:text="${userCount}"></strong><small th:text="${'有効 '+activeUserCount+' / 無効 '+disabledUserCount}"></small></article><article><span>ロック中</span><strong th:text="${lockedUserCount}"></strong></article><article><span>所属グループ</span><strong th:text="${groupCount}"></strong><small th:text="${'有効 '+activeGroupCount}"></small></article><article><span>参加承認待ち</span><strong th:text="${pendingMemberCount}"></strong></article><article><span>24時間のエラー</span><strong th:text="${errorCount}"></strong></article><article><span>データベース</span><strong th:text="${databaseOk?'正常':'異常'}"></strong></article><article><span>メンテナンス</span><strong th:text="${state.maintenance_enabled?'ON':'OFF'}"></strong></article><article><span>購入データ数</span><strong th:text="${shoppingCount}"></strong></article></section><div class="grid"><section class="panel"><h2>バージョン情報</h2><article th:each="v:${version}"><h3 th:text="${v.version}"></h3><p th:text="${v.content}"></p><time th:text="${v.published_at}"></time></article><p th:if="${#lists.isEmpty(version)}">有効なバージョン情報はありません。</p><a th:href="@{/admin/versions}">過去の情報を表示</a></section><section class="panel"><h2>システム状態</h2><p>アプリケーション：稼働中</p><p th:text="${'データベース：'+(databaseOk?'接続済み':'異常')}"></p><p>LINE通知：未設定</p><p>自動バックアップ：未設定</p></section></div><section class="panel table-wrap"><h2>最近の操作履歴</h2><table><tr><th>日時</th><th>ユーザー</th><th>操作</th><th>対象</th><th>結果</th></tr><tr th:each="l:${recentLogs}"><td th:text="${l.created_at}"></td><td th:text="${l.user_id?:'-'}"></td><td th:text="${l.action?:l.method+' '+l.path}"></td><td th:text="${l.target_id?:'-'}"></td><td th:text="${l.status}"></td></tr></table><a th:href="@{/admin/logs}">操作ログ一覧へ</a></section></main></body></html>
