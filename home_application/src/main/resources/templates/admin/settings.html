<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設定</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head><body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-area"><h1>設定</h1></div><div class="success" th:if="${param.saved}">設定を保存しました。</div><div class="success" th:if="${param.fontSaved}">フォントをアップロードしました。</div><div class="alert" th:if="${param.fontError}">TTFまたはOTF形式で、5MB以下の正しいフォントを選択してください。</div><section id="display-settings" class="panel"><h2>表示設定・フォント</h2><form th:action="@{/admin/settings/font}" method="post" enctype="multipart/form-data"><label>フォントファイル（TTF/OTF、最大5MB）<input type="file" name="font" accept=".ttf,.otf" required></label><button>アップロード</button></form></section><section id="system-settings" class="panel"><h2>システム設定</h2><form th:action="@{/admin/settings}" method="post" onsubmit="return confirm('設定内容を保存しますか？')"><div class="setting-row" th:each="s:${settings}"><label><strong th:text="${s.description}"></strong><small th:text="${s.key}"></small><input th:if="${!#strings.contains(s.key,'enabled') and !#strings.contains(s.key,'color') and s.key!='line_token'}" th:name="${'setting_'+s.key}" th:value="${s.value}"><input th:if="${#strings.contains(s.key,'color')}" type="color" th:name="${'setting_'+s.key}" th:value="${s.value}"><select th:if="${#strings.contains(s.key,'enabled')}" th:name="${'setting_'+s.key}"><option value="true" th:selected="${s.value=='true'}">有効</option><option value="false" th:selected="${s.value!='true'}">無効</option></select><input th:if="${s.key=='line_token'}" type="password" th:name="${'setting_'+s.key}" placeholder="変更する場合のみ入力"></label></div><button type="submit">設定を保存</button></form></section><p>LINEトークンは画面へ再表示せず、空欄の場合は既存値を保持します。</p></main></body></html>
