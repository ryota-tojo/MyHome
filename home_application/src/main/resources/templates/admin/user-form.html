<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユーザー登録</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/theme.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/polish.css}"><link rel="stylesheet" th:href="@{/css/actions.css}"></head>
<body class="admin-page"><header th:replace="~{fragments :: admin-header}"></header><main><div class="title-row"><h1>ユーザー登録</h1><a th:href="@{/admin/users}">一覧へ戻る</a></div><div class="alert" th:if="${error}" th:text="${error}"></div>
<section class="panel"><form class="registration-form" th:action="@{/admin/users/new}" method="post" onsubmit="return confirm('この内容でユーザーを登録しますか？')">
<label>ユーザーID<input name="userId" required maxlength="64"></label><label>表示名<input name="userName" required maxlength="100"></label><label>パスワード<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>パスワード確認<input type="password" name="confirmation" required minlength="8" autocomplete="new-password"></label>
<div><span class="field-label">所属グループ</span><div class="multi-check" data-card-target="selected-group-cards"><button class="multi-check__toggle" type="button" aria-expanded="false">選択してください</button><div class="multi-check__menu" hidden><input class="multi-check__search" type="search" placeholder="グループを検索" th:if="${#lists.size(groups)>selectSearchThreshold}"><label th:each="g:${groups}"><input class="multi-check__choice" type="checkbox" name="groupIds" th:value="${g.group_id}" th:attr="data-label=${g.group_name}"><span th:text="${g.group_name+' / '+g.group_id}"></span></label></div></div><div id="selected-group-cards" class="selected-group-cards"></div></div>
<div class="registration-form__actions"><button type="submit">登録</button></div></form></section></main></body></html>
